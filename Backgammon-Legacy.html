/* ---------- stats: per-game tracker, lifetime record, and the panels that show them ----------
   Move quality is rated by the built-in engine: for every turn we find the best reachable position by its
   static evaluation and measure how far the played position fell short. The loss scale was calibrated against the
   five AI levels (Beginner ~32% accuracy, Easy ~49%, Medium ~72%, Hard ~89%, Expert 100%). */
const Stats = (() => {
  const EXP_ROLL = 49 / 6;                   // average pips per roll, doubles count four times
  const DEEP_DEFICIT = 35;                   // pips behind at some point, then won = comeback
  const THRESH = { inacc: 3, mist: 6, blun: 14 };

  const blankPlayer = () => ({ turns: 0, hits: 0, rolls: 0, pips: 0, exp: 0, doubles: 0, rated: 0, loss: 0, perfect: 0, inacc: 0, mist: 0, blun: 0, cubeOffered: 0, cubeReceived: 0, cubeTaken: 0, cubePassed: 0, cubeAccepted: 0, cubePassedByOpp: 0 });
  const accOf = (s) => s.rated ? 100 * Math.exp(-(s.loss / s.rated) / 10) : null;
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

  /* ----- per-match tracker ----- */
  function newMatch(cfg) {
    const T = { cfg, games: [], cur: null, pend: [], timer: 0, t0: Date.now() };
    T.newGame = () => {
      T.cur = { n: T.games.length + 1, pl: [blankPlayer(), blankPlayer()], lead: [], winner: -1, base: 1, pts: 0, cv: 1, how: '', turns: 0, deficit: 0, t0: Date.now(), secs: 0 };
      T.games.push(T.cur);
    };
    T.roll = (p, a, b) => { const s = T.cur.pl[p]; s.rolls++; s.pips += a === b ? 4 * a : a + b; s.exp += EXP_ROLL; if (a === b) s.doubles++; };
    T.turn = (p, start, dice, end) => {
      const g = T.cur, s = g.pl[p], o = 1 - p;
      g.turns++; s.turns++;
      s.hits += Math.max(0, end.bar[o] - start.bar[o]);
      const lead = BG.pips(end, 1) - BG.pips(end, 0);      // positive: the bottom player leads the race
      g.lead.push(lead); g.deficit = Math.max(g.deficit, -lead);
      T.pend.push({ g, p, start, dice: dice.slice(), end });
      if (!T.timer) T.timer = setTimeout(T.tick, 40);
    };
    T.cube = (p, kind) => {
      const s = T.cur.pl[p], o = T.cur.pl[1 - p];
      if (kind === 'offer') { s.cubeOffered++; o.cubeReceived++; }
      else if (kind === 'take') { s.cubeTaken++; o.cubeAccepted++; }
      else if (kind === 'pass') { s.cubePassed++; o.cubePassedByOpp++; }
    };
    T.rate = (j) => {
      const list = BG.genTurns(j.start, j.p, j.dice);
      if (!list || list.length < 2 || !list[0].moves.length) return;
      let best = -1e9; for (const r of list) { const v = AI.evalPos(r.pos, j.p); if (v > best) best = v; }
      const loss = Math.min(60, Math.max(0, best - AI.evalPos(j.end, j.p)));
      const s = j.g.pl[j.p]; s.rated++; s.loss += loss;
      if (loss < 0.5) s.perfect++; else if (loss >= THRESH.blun) s.blun++; else if (loss >= THRESH.mist) s.mist++; else if (loss >= THRESH.inacc) s.inacc++;
    };
    T.tick = () => { T.timer = 0; const j = T.pend.shift(); if (j) { try { T.rate(j); } catch (e) { } } if (T.pend.length) T.timer = setTimeout(T.tick, 16); };
    T.flush = () => { clearTimeout(T.timer); T.timer = 0; while (T.pend.length) { try { T.rate(T.pend.shift()); } catch (e) { } } };
    T.endGame = (o) => {
      T.flush(); const g = T.cur;
      g.winner = o.winner; g.base = o.base; g.cv = o.cv; g.pts = o.pts; g.how = o.how;
      g.secs = Math.min(3600, Math.round((Date.now() - g.t0) / 1000));
      return g;
    };
    return T;
  }

  function aggregate(games) {
    const t = [blankPlayer(), blankPlayer()];
    for (const g of games) for (const p of [0, 1]) for (const k in t[p]) t[p][k] += g.pl[p][k];
    return t;
  }

  /* ----- lifetime record ----- */
  function record(T, res) {
    const c = P().career, cfg = T.cfg;
    T.flush();
    let streakBest = c.bestStreakGames;
    for (const g of T.games) {
      if (g.winner < 0) continue;
      const you = g.pl[0], opp = g.pl[1], won = g.winner === 0;
      c.games++;
      if (won) {
        c.gamesWon++; c.pointsWon += g.pts; if (g.base === 2) c.gammonsWon++; if (g.base === 3) c.bgWon++;
        if (g.cv > 1) c.cubeWins++; c.cubeBest = Math.max(c.cubeBest, g.cv);
        c.gameStreak++; streakBest = Math.max(streakBest, c.gameStreak);
        if (g.deficit >= DEEP_DEFICIT) c.comebacks++;
        if (g.how !== 'pass' && (!c.shortestWin || you.turns < c.shortestWin)) c.shortestWin = Math.max(1, you.turns);
      } else {
        c.pointsLost += g.pts; if (g.base === 2) c.gammonsLost++; if (g.base === 3) c.bgLost++;
        c.gameStreak = 0;
      }
      c.hits += you.hits; c.hurt += opp.hits; c.turns += you.turns; c.rolls += you.rolls; c.doubles += you.doubles; c.pips += you.pips; c.exp += you.exp;
      c.rated += you.rated; c.loss += you.loss; c.inacc += you.inacc; c.mist += you.mist; c.blun += you.blun; c.perfect += you.perfect;
      c.cubeOffered += you.cubeOffered; c.cubeAccepted += you.cubeAccepted; c.cubePassedByOpp += you.cubePassedByOpp;
      c.cubeReceived += you.cubeReceived; c.cubeTaken += you.cubeTaken; c.cubePassed += you.cubePassed;
      c.longestGame = Math.max(c.longestGame, you.turns); c.secs += g.secs;
    }
    c.bestStreakGames = streakBest;
    c.matches++; if (res.won) c.matchesWon++;
    const mode = cfg.mode === 'campaign' ? 'campaign' : cfg.wild ? 'wild' : 'quick';
    const bump = (o, k) => { const e = o[k] || (o[k] = { w: 0, l: 0 }); res.won ? e.w++ : e.l++; };
    bump(c.byMode, mode); bump(c.byVariant, cfg.variant); if (cfg.level) bump(c.byLevel, cfg.level);
    const tot = aggregate(T.games), acc = accOf(tot[0]);
    if (acc !== null && tot[0].rated >= 8) c.bestAcc = Math.max(c.bestAcc, Math.round(acc));
    c.history.push({ t: Date.now(), mode, opp: cfg.names[1], level: cfg.level || 0, variant: cfg.variant, len: cfg.matchLen, won: !!res.won, s0: res.score ? res.score[0] : 0, s1: res.score ? res.score[1] : 0, acc: acc === null ? null : Math.round(acc), luck: Math.round((tot[0].pips - tot[0].exp) - (tot[1].pips - tot[1].exp)) });
    if (c.history.length > 20) c.history = c.history.slice(-20);
  }

  /* ----- small chart parts. You = series 1, opponent = series 2 (validated pair, see --you / --opp) ----- */
  const f0 = (n) => String(Math.round(n));
  const f1 = (n) => (Math.round(n * 10) / 10).toFixed(1);
  const fa = (n) => n === null || n === undefined ? '–' : Math.round(n) + '%';

  function legend(n0, n1) { return `<div class="st-legend"><span><i class="you"></i>${esc(n0)}</span><span><i class="opp"></i>${esc(n1)}</span></div>`; }

  function vsRow(label, a, b, o) {
    o = o || {};
    const A = a === null ? 0 : a, B = b === null ? 0 : b, mx = Math.max(o.max || 0, A, B, 1e-9), ff = o.fmt || f0;
    const w = (v) => Math.max(v > 0 ? 3 : 0, 100 * v / mx);
    return `<div class="vs-row"><div class="vs-lab">${label}${o.note ? `<small>${o.note}</small>` : ''}</div><div class="vs-bars">
      <div class="vs-line" title="${esc(label)}: ${a === null ? '–' : ff(a)}"><i class="you" style="width:${w(A)}%"></i><b>${a === null ? '–' : ff(a)}</b></div>
      <div class="vs-line" title="${esc(label)}: ${b === null ? '–' : ff(b)}"><i class="opp" style="width:${w(B)}%"></i><b>${b === null ? '–' : ff(b)}</b></div></div></div>`;
  }

  function ring(value, label) {
    const r = 36, C = 2 * Math.PI * r, v = value === null ? 0 : Math.max(0, Math.min(100, value));
    return `<svg class="ring" viewBox="0 0 90 90" role="img" aria-label="${esc(label)} ${value === null ? 'not rated yet' : Math.round(v) + ' percent'}"><circle cx="45" cy="45" r="${r}" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="8"/>
      <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--you)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 45 45)"/>
      <text x="45" y="50" text-anchor="middle" class="ring-t">${value === null ? '–' : Math.round(v)}<tspan class="ring-u">${value === null ? '' : '%'}</tspan></text></svg>`;
  }

  // a line over turns with a zero baseline; `ahead` / `behind` labels in text colour
  function spark(series, topLabel, botLabel) {
    if (!series || series.length < 2) return '';
    const W = 300, H = 74, pad = 6;
    let lo = Math.min(0, ...series), hi = Math.max(0, ...series);
    if (hi - lo < 20) { hi += 10; lo -= 10; }
    const X = (i) => pad + (W - 2 * pad) * i / (series.length - 1), Y = (v) => pad + (H - 2 * pad) * (hi - v) / (hi - lo);
    const pts = series.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    const last = series[series.length - 1];
    return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Race lead over the game"><line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="rgba(255,255,255,0.22)" stroke-dasharray="3 4"/>
      <polyline points="${pts}" fill="none" stroke="var(--you)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
      <span class="sp-top">${esc(topLabel)}</span><span class="sp-bot">${esc(botLabel)}</span><span class="sp-end">${last > 0 ? '+' : ''}${Math.round(last)}</span></div>`;
  }

  /* ----- panels shown after each game and after the match ----- */
  function luckLine(a, b, n0, n1) {
    if (!a.rolls || !b.rolls) return '';
    const d = (a.pips - a.exp) - (b.pips - b.exp), q = Math.abs(d);
    const txt = q < 6 ? 'The dice were about even.' : (d > 0 ? esc(n0) + ' had the better dice, worth about ' + Math.round(q) + ' pips.' : esc(n1) + ' had the better dice, worth about ' + Math.round(q) + ' pips.');
    return `<div class="st-note">${txt}</div>`;
  }

  function panel(pl, cfg, extra) {
    const [a, b] = pl, n0 = cfg.names[0], n1 = cfg.names[1];
    const acc0 = accOf(a), acc1 = accOf(b);
    const rows = [
      vsRow('Move accuracy', acc0, acc1, { fmt: fa, max: 100, note: 'rated by the built-in engine' }),
      vsRow('Mistakes and blunders', a.mist + a.blun, b.mist + b.blun),
      vsRow('Checkers hit', a.hits, b.hits),
      vsRow('Pips rolled', a.pips, b.pips),
      vsRow('Doubles rolled', a.doubles, b.doubles),
      vsRow('Turns played', a.turns, b.turns),
    ];
    return `<div class="st-panel">${legend(n0, n1)}${rows.join('')}${luckLine(a, b, n0, n1)}${extra || ''}</div>`;
  }

  const wordFor = (g) => g.base === 3 ? 'backgammon' : g.base === 2 ? 'gammon' : g.how === 'pass' ? 'cube passed' : 'single game';

  function gamePanel(T, g) {
    const lead = spark(g.lead, T.cfg.names[0] + ' ahead', T.cfg.names[0] + ' behind');
    return panel(g.pl, T.cfg, lead ? `<div class="st-sub">Race lead after each turn (pip count difference)</div>${lead}` : '');
  }

  function matchPanel(T) {
    const tot = aggregate(T.games), cfg = T.cfg;
    const rows = T.games.map(g => {
      const w = g.winner, name = esc(cfg.names[w]);
      return `<tr><td>Game ${g.n}</td><td>${name} · ${g.pts} pt${g.pts > 1 ? 's' : ''} <small>${wordFor(g)}${g.cv > 1 ? ', cube ' + g.cv : ''}</small></td><td>${g.pl[0].turns} turns</td><td>${fa(accOf(g.pl[0]))} <small>/</small> ${fa(accOf(g.pl[1]))}</td></tr>`;
    }).join('');
    const secs = T.games.reduce((s, g) => s + g.secs, 0);
    const list = `<div class="st-sub">Game by game · ${fmtTime(secs)} on the board</div><table class="rw-table st-games">${rows}</table>`;
    return panel(tot, cfg, list);
  }

  function fmtTime(s) {
    s = Math.round(s); if (s < 60) return s + ' sec';
    const m = Math.round(s / 60); if (m < 60) return m + ' min';
    const h = Math.floor(m / 60); return h + ' h ' + (m % 60) + ' min';
  }

  /* ----- the lifetime Stats screen ----- */
  const LVN = { 1: 'Beginner', 2: 'Easy', 3: 'Medium', 4: 'Hard', 5: 'Expert' };
  const VAR = () => BG.VARIANTS;

  function wlRows(o, order, names) {
    const rows = order.filter(k => o[k] && (o[k].w + o[k].l)).map(k => {
      const e = o[k], tot = e.w + e.l;
      return `<div class="wl-row"><span class="wl-lab">${esc(names(k))}</span><span class="wl-bar" title="${e.w} won, ${e.l} lost">${e.w ? `<i class="you" style="flex:${e.w}"></i>` : ''}${e.l ? `<i class="opp" style="flex:${e.l}"></i>` : ''}</span><span class="wl-n">${e.w}–${e.l}</span></div>`;
    });
    return rows.length ? rows.join('') : '<div class="st-empty">Nothing yet</div>';
  }

  function tile(big, label, sub) { return `<div class="st-tile"><b>${big}</b><span>${label}</span>${sub ? `<small>${sub}</small>` : ''}</div>`; }
  function rec(label, val) { return `<div class="st-rec"><span>${label}</span><b>${val}</b></div>`; }

  function accTrend(hist) {
    const pts = hist.filter(h => h.acc !== null && h.acc !== undefined);
    if (pts.length < 2) return '';
    const W = 300, H = 60, pad = 6, lo = Math.max(0, Math.min(...pts.map(h => h.acc)) - 8), hi = Math.min(100, Math.max(...pts.map(h => h.acc)) + 8);
    const X = (i) => pad + (W - 2 * pad) * i / (pts.length - 1), Y = (v) => pad + (H - 2 * pad) * (hi - v) / Math.max(1, hi - lo);
    return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Accuracy over your last matches"><polyline points="${pts.map((h, i) => X(i).toFixed(1) + ',' + Y(h.acc).toFixed(1)).join(' ')}" fill="none" stroke="var(--you)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><span class="sp-top">${Math.round(hi)}%</span><span class="sp-bot">${Math.round(lo)}%</span></div>`;
  }

  function renderScreen() {
    const c = P().career, body = $('#stats-body'), li = DATA.levelInfo(P().xp);
    if (!c.matches) {
      body.innerHTML = `<div class="st-empty-page"><h3>No matches on record yet</h3><p>Finish a match against the computer, in the campaign or in a quick game, and your results, move accuracy, dice luck and records will build up here.</p><button class="btn primary" id="st-go">Play the computer</button></div>`;
      $('#st-go').onclick = () => { SFX.click(); openSetup('quick'); };
      return;
    }
    const acc = c.rated ? 100 * Math.exp(-(c.loss / c.rated) / 10) : null;
    const per100 = (n) => c.rated ? f1(100 * n / c.rated) : '–';
    const avgRoll = c.rolls ? c.pips / c.rolls : 0, dblRate = c.rolls ? 100 * c.doubles / c.rolls : 0;
    const luckPips = c.pips - c.exp;
    const lvlOrder = [1, 2, 3, 4, 5], varOrder = Object.keys(VAR()), modeNames = { campaign: 'Campaign', quick: 'Quick match', wild: 'Wild mode' };
    const tiles = [
      tile(c.matchesWon + '–' + (c.matches - c.matchesWon), 'Matches won – lost', pct(c.matchesWon, c.matches) + '% win rate'),
      tile(fmt(c.games), 'Games played', c.gamesWon + ' won'),
      tile(fmtTime(c.secs), 'Time on the board', c.turns ? fmt(c.turns) + ' turns' : ''),
      tile(li.level, DATA.rankFor(li.level), fmt(P().xp) + ' XP in total'),
    ].join('');
    const skill = `<div class="st-card"><h3>Move accuracy</h3><div class="st-skill">${ring(acc, 'Move accuracy')}<div class="st-skill-r">
        <div class="st-rec"><span>Perfect turns</span><b>${pct(c.perfect, c.rated)}%</b></div>
        <div class="st-rec"><span>Inaccuracies per 100 turns</span><b>${per100(c.inacc)}</b></div>
        <div class="st-rec"><span>Mistakes per 100 turns</span><b>${per100(c.mist)}</b></div>
        <div class="st-rec"><span>Blunders per 100 turns</span><b>${per100(c.blun)}</b></div></div></div>
      <div class="st-note">${fmt(c.rated)} turns with a real choice, rated against the built-in engine. 100% means you always found its favourite play.</div>${accTrend(c.history) ? `<div class="st-sub" style="margin-top:12px">Match accuracy, last ${c.history.filter(h => h.acc !== null).length} matches</div>` + accTrend(c.history) : ''}</div>`;
    const dice = `<div class="st-card"><h3>Dice</h3>
      <div class="st-rec"><span>Average pips per roll</span><b>${f1(avgRoll)} <small>expected 8.2</small></b></div>
      <div class="st-rec"><span>Doubles</span><b>${f1(dblRate)}% <small>expected 16.7%</small></b></div>
      <div class="st-rec"><span>Pips above or below average</span><b>${luckPips > 0 ? '+' : ''}${Math.round(luckPips)}</b></div>
      <div class="st-note">Over thousands of rolls luck evens out. A big gap here is a streak, not skill.</div></div>`;
    const results = `<div class="st-card"><h3>Results</h3>${legend('Won', 'Lost')}
      <div class="st-sub">By opponent level</div>${wlRows(c.byLevel, lvlOrder, k => LVN[k] || 'Level ' + k)}
      <div class="st-sub" style="margin-top:12px">By game type</div>${wlRows(c.byVariant, varOrder, k => (VAR()[k] ? VAR()[k].name : k))}
      <div class="st-sub" style="margin-top:12px">By mode</div>${wlRows(c.byMode, ['campaign', 'quick', 'wild'], k => modeNames[k] || k)}</div>`;
    const scoring = `<div class="st-card"><h3>Scoring and cube</h3>
      ${rec('Points won / lost', fmt(c.pointsWon) + ' / ' + fmt(c.pointsLost))}
      ${rec('Gammons won / lost', c.gammonsWon + ' / ' + c.gammonsLost)}
      ${rec('Backgammons won / lost', c.bgWon + ' / ' + c.bgLost)}
      ${rec('Checkers hit / lost', fmt(c.hits) + ' / ' + fmt(c.hurt))}
      ${rec('You doubled', c.cubeOffered + (c.cubeOffered ? ' <small>' + pct(c.cubeAccepted, c.cubeOffered) + '% taken</small>' : ''))}
      ${rec('You were doubled', c.cubeReceived + (c.cubeReceived ? ' <small>took ' + c.cubeTaken + ', passed ' + c.cubePassed + '</small>' : ''))}
      ${rec('Games won on a cube', c.cubeWins)}</div>`;
    const recs = `<div class="st-card"><h3>Records</h3>
      ${rec('Best win streak (games)', c.bestStreakGames)}
      ${rec('Biggest cube won', c.cubeBest)}
      ${rec('Comebacks from 35+ pips down', c.comebacks)}
      ${rec('Longest game', c.longestGame ? c.longestGame + ' turns' : '–')}
      ${rec('Fastest win', c.shortestWin ? c.shortestWin + ' turns' : '–')}
      ${rec('Best match accuracy', c.bestAcc ? c.bestAcc + '%' : '–')}
      ${rec('Best match streak', P().stats.bestStreak)}</div>`;
    const hist = c.history.slice().reverse().map(h => `<div class="hist-row"><span class="pill ${h.won ? 'w' : 'l'}">${h.won ? 'W' : 'L'}</span><span class="h-main"><b>${esc(h.opp || 'Computer')}</b><small>${esc((VAR()[h.variant] || {}).name || h.variant)}${h.level ? ' · ' + (LVN[h.level] || '') : ''}${h.len > 1 ? ' · first to ' + h.len : ''}</small></span><span class="h-sc">${h.s0}–${h.s1}</span><span class="h-acc">${fa(h.acc)}</span></div>`).join('');
    const recent = `<div class="st-card wide"><h3>Recent matches</h3><div class="hist-head"><span></span><span>Opponent</span><span>Score</span><span>Accuracy</span></div>${hist}</div>`;
    body.innerHTML = `<div class="st-tiles">${tiles}</div><div class="st-grid">${skill}${dice}${results}${scoring}${recs}</div>${recent}`;
  }

  /* tabs inside a modal: buttons carry data-tab, panes carry data-pane */
  const tabsHTML = (names) => `<div class="st-tabs">${names.map((n, i) => `<button type="button" class="${i ? '' : 'on'}" data-tab="${i}">${esc(n)}</button>`).join('')}</div>`;
  function wireTabs(api) {
    api.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]'); if (!b) return;
      SFX.click();
      $$('[data-tab]', api.el).forEach(x => x.classList.toggle('on', x === b));
      $$('[data-pane]', api.el).forEach(x => { x.hidden = x.dataset.pane !== b.dataset.tab; });
    });
  }

  return { newMatch, aggregate, record, tabsHTML, wireTabs, gamePanel, matchPanel, renderScreen, accOf, fmtTime };
})();

Nav.onShow.stats = () => Stats.renderScreen();

/* ---------- Wild mode: perks, the pre-match draft, and how the computer uses them ----------
   Every perk has one charge per game. Only one perk may be played per turn. */
const Wild = (() => {
  // when: 'dice' = after you have rolled and before your first move; 'any' = before you roll or while you move
  const PERKS = [
    { id: 'reroll', icon: '🎲', name: 'Reroll', blurb: 'Throw both dice again.', when: 'dice', ai: true },
    { id: 'nudge', icon: '±1', name: 'Nudge', blurb: 'Move one die up or down by one pip.', when: 'dice', ai: true },
    { id: 'twin', icon: '👯', name: 'Twin', blurb: 'Make the second die match the first. A double!', when: 'dice', ai: true },
    { id: 'bonus', icon: '➕', name: 'Bonus Die', blurb: 'Roll a third die and play it too. Not on doubles.', when: 'dice', ai: true },
    { id: 'peek', icon: '🔮', name: 'Foresight', blurb: "See the opponent's next roll before they throw it.", when: 'any', ai: false },
    { id: 'hex', icon: '🧿', name: 'Hex', blurb: 'The opponent rolls twice next turn and keeps the lower total.', when: 'any', ai: true },
    { id: 'shield', icon: '🛡️', name: 'Safe Harbor', blurb: 'Your lone checkers cannot be hit until your next turn.', when: 'any', ai: true },
  ];
  const byId = (id) => PERKS.find(p => p.id === id);
  const DRAFT_SIZE = 6, PICKS = 3;

  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const offer = () => shuffle(PERKS.map(p => p.id)).slice(0, DRAFT_SIZE);
  const pickForAI = () => shuffle(PERKS.filter(p => p.ai).map(p => p.id)).slice(0, PICKS);

  /* ----- the draft: pick three of six ----- */
  function draft(opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      const ids = offer(), chosen = [];
      const card = (id) => { const p = byId(id); return `<button type="button" class="perk-card" data-pk="${id}"><span class="pk-ico">${p.icon}</span><b>${p.name}</b><small>${p.blurb}</small></button>`; };
      const api = modal({
        dismiss: false, wide: true,
        html: `<h2>Choose your perks</h2><p class="lead">Pick three. Each can be played once per game, and only one perk per turn. ${opts.opp ? esc(opts.opp) + ' draws three of their own.' : ''}</p>
          <div class="perk-grid">${ids.map(card).join('')}</div>
          <div class="btns"><button class="btn" data-act="rand">Surprise me</button><button class="btn primary" data-act="go" disabled>Start match</button></div>`,
        actions: {
          rand: (a) => { chosen.length = 0; shuffle(ids).slice(0, PICKS).forEach(x => chosen.push(x)); sync(a); return false; },
          go: () => { resolve(chosen.slice()); },
        },
        after: (a) => {
          sync(a);
          a.el.addEventListener('click', (e) => {
            const b = e.target.closest('[data-pk]'); if (!b) return;
            const id = b.dataset.pk, i = chosen.indexOf(id);
            if (i >= 0) chosen.splice(i, 1); else if (chosen.length < PICKS) chosen.push(id); else { chosen.shift(); chosen.push(id); }
            SFX.click(); sync(a);
          });
        },
      });
      function sync(a) {
        $$('.perk-card', a.el).forEach(c => c.classList.toggle('on', chosen.includes(c.dataset.pk)));
        const go = $('[data-act="go"]', a.el); go.disabled = chosen.length !== PICKS; go.textContent = chosen.length === PICKS ? 'Start match' : 'Pick ' + (PICKS - chosen.length) + ' more';
      }
    });
  }

  /* ----- computer decisions ----- */
  const scoreRoll = (pos, p, dice) => { const r = AI.chooseTurn(pos, p, dice, { exact: true }); return r.moves && r.moves.length ? AI.evalPos(r.pos, p) : AI.evalPos(pos, p) - 4; };
  const sumOf = (d) => d.length === 4 ? 4 * d[0] : d.reduce((a, b) => a + b, 0);

  // Dice perks, decided after the AI has rolled. `dice` is [a,b] or [a,a,a,a]. Returns {id, dice} or null.
  function decideDice(pos, p, dice, have, level, turnNo) {
    if (!have.length || (turnNo !== undefined && turnNo < 3)) return null;   // save perks for the middle game
    const base = scoreRoll(pos, p, dice);
    let best = null, bestGain = 0;
    const consider = (id, gain, nd) => { if (have.includes(id) && gain > bestGain) { bestGain = gain; best = { id, dice: nd }; } };
    const pairOf = (d) => d.length === 4 ? [d[0], d[0]] : d.slice();
    const [a, b] = pairOf(dice);
    const mk = (x, y) => BG.diceToList(x, y);
    if (have.includes('reroll')) {
      let tot = 0, n = 0;
      for (let x = 1; x <= 6; x++) for (let y = x; y <= 6; y++) { const w = x === y ? 1 : 2; tot += w * scoreRoll(pos, p, mk(x, y)); n += w; }
      const avg = tot / n;
      consider('reroll', avg - base - 3, null);   // needs a clear shortfall, since the new roll is a gamble
    }
    if (have.includes('nudge')) {
      for (const [i, d] of [[0, a], [1, b]]) for (const dv of [-1, 1]) {

/* ============================================================
   Game controller: matches, turns, input, cube, results, rewards
   ============================================================ */
const Game = (() => {
  const G = { runId: 0, active: false, cfg: null, phase: 'idle', waiter: null, busy: false, turn: 0, rem: [], pos: null, history: [], legal: [], movable: new Set(), dests: [], ptr: null, cube: { value: 1, owner: -1 }, score: [0, 0], stats: {}, lastTap: null };
  let view = null;
  const wrap = () => $('#board-wrap');
  const isHuman = (p) => G.cfg.mode === '2p' || p === 0;
  const alive = (id) => id === G.runId;
  const online = () => !!(G.cfg && G.cfg.mode === 'online');
  const dieRoll = () => online() ? Net.die() : BG.rollDie();
  const openingPair = () => { if (!online()) return [BG.rollDie(), BG.rollDie()]; const x = Net.die(), y = Net.die(); return Net.role === 'host' ? [x, y] : [y, x]; };
  const EMOTES = ['Good luck!', 'Nice move!', 'Well played!', 'Oops…', 'Your turn!', 'Thanks!', 'Rematch?'];

  /* ---------- setup ---------- */
  function initView() {
    if (view) return view;

    view = makeView(cv);
    view.snd = (n, a) => { if (SFX[n]) SFX[n](a); Device.haptic(n); };
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', () => { if (G.ptr && G.ptr.dragging) view.endDrag(); G.ptr = null; });
    new ResizeObserver(fit).observe(wrap());
    window.addEventListener('resize', fit);
    window.addEventListener('keydown', onKey);
    $('#g-roll').addEventListener('click', () => { SFX.resume(); if (G.phase === 'preroll' || G.phase === 'opening') signal('preroll', 'roll'); });
    $('#g-double').addEventListener('click', () => { if (canDouble(G.turn) && G.phase === 'preroll') signal('preroll', 'double'); });
    $('#g-undo').addEventListener('click', undo);
    $('#g-hint').addEventListener('click', hint);
    $('#g-menu').addEventListener('click', openGameMenu);
    $('#g-emote').addEventListener('click', openEmotes);
    $('#perkbar').addEventListener('click', (e) => { const b = e.target.closest('[data-perk]'); if (b && !b.disabled) { SFX.click(); usePerkUI(b.dataset.perk); } });
    $('#g-sound').addEventListener('click', () => { P().settings.sound = !P().settings.sound; Store.save(); applySettings(); SFX.click(); });
    return view;
  }
  function fit() {
    if (!view || Nav.cur !== 'game') return;
    const w = wrap().clientWidth - 12, h = wrap().clientHeight - 12;
    if (w < 60 || h < 60) return;
    view.setRotated(w / h < 0.9);
    view.fit(w, h);
  }
  function applyCosmetics() {
    const e = P().equipped;
    view.setCosmetics({ board: e.board, checkers: e.checkers, dice: e.dice, moveFx: e.moveFx, throwFx: e.throwFx, trim: e.trim, inlay: e.inlay, mat: e.mat, cube: e.cube });

  }
  function resetBoardView() {
    view.tweens.length = 0; view.flights.length = 0; view.parts.length = 0;

    $('#board-toast').innerHTML = '';

  function start(cfg) {
    initView();
    G.runId++;
    const id = G.runId;
    cfg.names = cfg.names || ['You', 'Computer'];
    G.cfg = cfg; G.score = [0, 0]; G.gameNo = 0; G.crawfordUsed = false; G.crawford = false;
    G.stats = { hits: 0, hurt: 0, turns: 0, gammons: 0, backgammons: 0, cubeWin: 0, oppLeft: 0, games: 0, pointsWon: 0 };
    G.levelAtStart = DATA.levelInfo(P().xp).level; G.gameXP = 0; G.gameCoins = 0; G.gamesWon = 0; G.gamesLost = 0; G.cheated = false; G.cheat = { roll: null, doubles: false, aiPass: false };

  /* ---------- match / game flow ---------- */
  async function runMatch(id) {
    if (G.cfg.wild) {
      G.perkIds[0] = await Wild.draft({ opp: G.cfg.names[1] });
      if (!alive(id)) return;
      G.perkIds[1] = Wild.pickForAI();
    }
    while (alive(id)) {
      const out = await runGame(id);
      if (!alive(id)) return;
      if (out === 'gone') return;
      if (out === 'match') { await showMatchResult(id); return; }

  async function runGame(id) {
    const c = G.cfg, m = c.matchLen;
    G.gameNo++;
    G.crawford = false;
    if (c.cube && m > 1 && !G.crawfordUsed && (G.score[0] === m - 1 || G.score[1] === m - 1)) { G.crawford = true; G.crawfordUsed = true; }
    G.pos = BG.startPos(c.variant, online() ? Net.rand : undefined); G.turn = 0; G.cube = { value: 1, owner: -1 }; G.rem = []; G.history = [];

    let a, b;
    do {

      await view.throwDice([{ value: a, side: 0 }, { value: b, side: 1 }]);
      if (!alive(id)) return;
      if (a === b) { say('Tie. Rolling again.'); banner('Tie'); await view.wait(1000); if (!alive(id)) return; }

    G.rem = [a, b];

    banner(G.cfg.names[G.turn] + ' ' + (isHuman(G.turn) && G.cfg.mode !== '2p' ? 'start' : 'starts'));
    say(esc(G.cfg.names[G.turn]) + ' ' + (G.cfg.mode !== '2p' && G.turn === 0 ? 'open' : 'opens') + ' with ' + a + ' and ' + b + '.');
    await view.wait(900);
    if (!alive(id)) return;

    let skipRoll = true;
    while (alive(id)) {
      if (!skipRoll) {
        G.perkTurn = false;
        G.phase = 'preroll'; G.history = []; view.turnPlayer = G.turn; view.sel = null; view.dests = []; view.movable = []; view.hint = null;
        updateHUD(); updateActions();
        // doubling
        if (!online() && !isHuman(G.turn) && canDouble(G.turn) && AI.shouldDouble(G.pos, G.turn, { level: c.level, style: c.style })) {
          const out = await doDouble(id, G.turn);
          if (!alive(id)) return;
          if (out === 'pass') return finishGame(id, G.turn, 'pass');
        }
        if (isHuman(G.turn)) {
          let rolled = false;
          while (!rolled) {
            updateActions();
            say(esc(G.cfg.names[G.turn]) + (G.cfg.mode === '2p' ? ', roll the dice.' : ': roll the dice.') + (canDouble(G.turn) ? ' <small>You may double first.</small>' : ''));
            let act;
            if (P().settings.autoRoll && !canDouble(G.turn)) { await view.wait(450); act = 'roll'; }
            else act = await waitFor('preroll');
            if (!alive(id)) return;
            if (act === 'double') {
              const out = await doDouble(id, G.turn);
              if (!alive(id)) return;
              if (out === 'gone') return oppGone(id);
              if (out === 'pass') return finishGame(id, G.turn, 'pass');
              continue;
            }
            rolled = true;
          }
        } else if (online()) {
          say(esc(G.cfg.names[G.turn]) + ' is about to roll…');
          let rolled = false;
          while (!rolled) {
            const m = await Net.next(['roll', 'double']);
            if (!alive(id)) return;
            if (!m) return oppGone(id);
            if (m.t === 'double') {
              const out = await doDouble(id, G.turn);
              if (!alive(id)) return;
              if (out === 'gone') return oppGone(id);
              if (out === 'pass') return finishGame(id, G.turn, 'pass');
              say(esc(G.cfg.names[G.turn]) + ' is about to roll…');
              continue;
            }
            rolled = true; G.remoteDice = m.d;
          }
        } else {
          if (c.wild) { await aiPerksPre(id); if (!alive(id)) return; }
          say(esc(G.cfg.names[G.turn]) + ' rolls…'); await view.wait(550); if (!alive(id)) return;
        }
        // roll
        G.phase = 'rolling'; G.busy = true; updateActions();
        const [d1, d2] = rollPair(G.turn);
        if (online()) {
          if (G.turn === 0) Net.send('roll', { d: [d1, d2] });
          else if (G.remoteDice && (G.remoteDice[0] !== d1 || G.remoteDice[1] !== d2)) { desync(); return oppGone(id); }
        }
        await view.throwDice([{ value: d1, side: G.turn }, { value: d2, side: G.turn }]);
        if (!alive(id)) return;
        G.busy = false;
        G.track.roll(G.turn, d1, d2);
        G.rem = BG.diceToList(d1, d2);
        view.setDiceRemaining(G.rem);
      }
      skipRoll = false;
      G.phase = 'moving'; G.history = [];
      G.turnStart = { p: G.turn, pos: G.pos, dice: G.rem.slice() };
      const legal = BG.legalNext(G.pos, G.turn, G.rem);
      updateHUD(); updateActions();
      if (!legal.length) {
        say(esc(G.cfg.names[G.turn]) + ' has no legal move.'); banner('No move');
        view.setDiceRemaining([]);
        await view.wait(1300);
      } else if (!isHuman(G.turn)) {
        if (online()) { const r = await remotePlay(id); if (!alive(id)) return; if (r === 'gone') return oppGone(id); }
        else await aiPlay(id);
      } else {
        await humanMoves(id);
      }
      if (!alive(id)) return;
      if (G.cfg.mode !== '2p' && G.turn === 0) G.stats.turns++;
      if (G.turnStart) { G.track.turn(G.turnStart.p, G.turnStart.pos, G.turnStart.dice, G.pos); G.turnStart = null; }
      const w = BG.winnerOf(G.pos);
      if (w >= 0) return finishGame(id, w, 'normal');
      G.turn = 1 - G.turn;
      if (G.pos.shield && G.pos.shield[G.turn]) { setShield(G.turn, false); }
      await view.wait(350);
    }
  }

  function rollPair(p) {
    if (G.peek[p]) { const r = G.peek[p]; G.peek[p] = null; renderPerks(); return r; }
    if (G.hex[p]) {
      G.hex[p] = false; renderPerks();
      const a = [BG.rollDie(), BG.rollDie()], b = [BG.rollDie(), BG.rollDie()];
      banner('Hexed: lower roll kept');
      return Wild.sumOf(a[0] === a[1] ? [a[0], a[0], a[0], a[0]] : a) <= Wild.sumOf(b[0] === b[1] ? [b[0], b[0], b[0], b[0]] : b) ? a : b;
    }
    if (isHuman(p) && !online()) {
      if (G.cheat.roll) { const r = G.cheat.roll; G.cheat.roll = null; G.cheated = true; return r.slice(); }
      if (G.cheat.doubles) { const d = BG.rollDie(); G.cheated = true; return [d, d]; }
    }
    return [dieRoll(), dieRoll()];
  }

  async function humanMoves(id) {
    view.turnPlayer = G.turn;
    say(esc(G.cfg.names[G.turn]) + (G.cfg.mode === '2p' ? ': your move.' : ': your move.') + ' <small>Tap a checker, then where it goes. You can also drag.</small>');
    refreshHighlights(); updateActions();
    maybeAssist();
    await waitFor('moves');
  }

  async function aiPlay(id) {
    const c = G.cfg;
    say(esc(c.names[G.turn]) + ' is thinking…');
    await view.wait(450 + Math.random() * 350);
    if (!alive(id)) return;
    if (c.wild && !G.perkTurn) {
      const have = Array.from(G.charges[G.turn]).filter(x => Wild.byId(x).when === 'dice');
      const dec = Wild.decideDice(G.pos, G.turn, G.rem.slice(), have, c.level, G.track.cur ? G.track.cur.pl[G.turn].turns : 9);
      if (dec) { await perkApply(G.turn, dec.id, dec.dice); if (!alive(id)) return; }
    }
    const r = AI.chooseTurn(G.pos, G.turn, G.rem.slice(), { level: c.level, style: c.style });
    for (const m of r.moves) {
      if (!alive(id)) return;
      await doMove(m, { ai: true });
      await view.wait(110);
    }
    if (!alive(id)) return;
    if (c.wild && !G.perkTurn && BG.winnerOf(G.pos) < 0) {
      const dec = Wild.decideAny(G.pos, G.turn, Array.from(G.charges[G.turn]), 'post', G.track.cur ? G.track.cur.turns : 0);
      if (dec) { await perkApply(G.turn, dec.id); if (!alive(id)) return; }
    }
    say(esc(c.names[G.turn]) + ' played.');
  }

  function maybeAssist() {
    if (!P().settings.assist || G.legal.length !== 1) return;
    if (G.cfg.wild && G.turn === 0 && !G.perkTurn && !G.history.length && Array.from(G.charges[0]).some(x => Wild.byId(x).when === 'dice')) return;
    const id = G.runId, m = G.legal[0];
    setTimeout(() => { if (alive(id) && G.phase === 'moving' && !G.busy && G.legal.length === 1 && G.legal[0] === m) { view.sel = null; doMove(m, {}); } }, 520);
  }

  /* ---------- online play ---------- */
  // the other player's moves arrive as messages, in their own point numbering (they are 'player 0' on their screen): mirror them
  async function remotePlay(id) {
    say(esc(G.cfg.names[G.turn]) + ' is playing…');
    const flip = (i) => (i >= 24 ? i : 23 - i);
    while (alive(id) && G.rem.length && BG.legalNext(G.pos, G.turn, G.rem).length) {
      const msg = await Net.next(['move']);
      if (!alive(id)) return;
      if (!msg) return 'gone';
      const mv = msg.mv || {}, legal = BG.legalNext(G.pos, G.turn, G.rem);
      const want = { from: flip(mv.from), to: mv.to === BG.OFF ? BG.OFF : flip(mv.to), die: mv.die };
      const m = legal.find(l => l.from === want.from && l.to === want.to && l.die === want.die);
      if (!m) { desync(); return 'gone'; }
      await doMove(m, { ai: true });
      if (!alive(id)) return;
      await view.wait(110);
    }
    say(esc(G.cfg.names[G.turn]) + ' played.');
  }
  function desync() { G.desync = true; }
  function oppGone(id) {
    if (!alive(id)) return 'gone';
    const c = G.cfg; G.phase = 'over'; G.busy = false; updateActions();
    modal({
      dismiss: false,
      html: G.desync
        ? `<h2>The game went out of sync</h2><p class="lead">A move or roll from ${esc(c.names[1])} did not match the rules, so the match has been stopped. No rewards are paid.</p><div class="btns"><button class="btn primary" data-act="menu">Back to menu</button></div>`
        : `<h2>${esc(c.names[1])} left the match</h2><p class="lead">The match ends here. Unfinished online matches pay no rewards.</p><div class="btns"><button class="btn primary" data-act="menu">Back to menu</button></div>`,
      actions: { menu: () => { show('menu'); } },
    });
    return 'gone';
  }
  function wireOnline() {
    G.lostTimer = null; G.lostModal = null;
    Net.on({
      bye: () => {
        if (!G.active || !online()) return;
        clearTimeout(G.lostTimer);
        if (G.phase === 'over' && G.matchDone) { toast(G.cfg.names[1] + ' has left'); const b = document.querySelector('#modal-root [data-act="again"]'); if (b) { b.disabled = true; b.textContent = 'Opponent left'; } return; }
        G.runId++; G.waiter = null; oppGone(G.runId);
      },
      emo: (d) => { if (online() && EMOTES[d.k]) { banner(G.cfg.names[1] + ': ' + EMOTES[d.k]); SFX.click(); } },
      status: (st) => {
        if (!G.active || !online() || G.phase === 'over') return;
        clearTimeout(G.lostTimer);
        if (st === 'lost') {
          banner('Connection lost…');
          G.lostTimer = setTimeout(() => {
            if (!G.active || G.phase === 'over' || !Net.lost) return;
            G.lostModal = modal({
              dismiss: false,
              html: `<h2>${esc(G.cfg.names[1])} has gone quiet</h2><p class="lead">There has been no word for a while. You can keep waiting, or end the match here.</p><div class="btns"><button class="btn" data-act="wait">Keep waiting</button><button class="btn primary" data-act="end">End match</button></div>`,
              actions: { wait: () => { }, end: () => { G.runId++; G.waiter = null; G.desync = false; const c = G.cfg; G.phase = 'over'; modal({ dismiss: false, html: `<h2>Match ended</h2><p class="lead">${esc(c.names[1])} did not come back. Unfinished online matches pay no rewards.</p><div class="btns"><button class="btn primary" data-act="menu">Back to menu</button></div>`, actions: { menu: () => { show('menu'); } } }); } },
            });
          }, 25000);
        } else if (st === 'back') { banner('Back online'); if (G.lostModal) { G.lostModal.close(); G.lostModal = null; } }
      },
      rematch: () => {
        if (!G.active || !online()) return;
        const root = $('#modal-root'); while (root.firstChild) root.firstChild.remove();
        start(Object.assign({}, G.cfg));
      },
    });
  }
  function openEmotes() {
    if (!online() || !G.active) return;
    modal({
      html: `<h2>Say something</h2><p class="lead">Quick messages for ${esc(G.cfg.names[1])}.</p><div class="emotes">${EMOTES.map((t, i) => `<button class="btn" data-act="e${i}">${t}</button>`).join('')}</div><div class="btns"><button class="btn" data-act="x">Close</button></div>`,
      actions: Object.assign({ x: () => { } }, ...EMOTES.map((t, i) => ({ ['e' + i]: () => { Net.send('emo', { k: i }); banner('You: ' + t); } }))),
    });
  }

  /* ---------- moves ---------- */
  async function doMove(m, o) {
    o = o || {};
    const id = G.runId;
    if (online() && G.turn === 0 && !o.ai) Net.send('move', { mv: { from: m.from, to: m.to, die: m.die, hit: !!m.hit } });
    G.busy = true;
    G.history.push({ pos: G.pos, rem: G.rem.slice(), stats: Object.assign({}, G.stats) });
    G.pos = BG.applyMove(G.pos, G.turn, m);
    G.rem.splice(G.rem.indexOf(m.die), 1);
    if (m.hit && G.cfg.mode !== '2p') { if (G.turn === 0) G.stats.hits++; else G.stats.hurt++; }
    view.sel = null; view.dests = []; view.movable = []; view.hint = null;
    G.dests = []; G.movable = new Set();
    updateHUD(); updateActions();
    await view.moveChecker(m, G.turn, undefined, o.from ? { from: o.from, fx: 'glide' } : undefined);
    if (!alive(id)) return;
    view.setDiceRemaining(G.rem);
    G.busy = false;
    if (!o.quiet && !o.ai) afterHumanMove();
  }
  function afterHumanMove() {
    if (G.phase !== 'moving') return;
    if (BG.winnerOf(G.pos) >= 0 || G.rem.length === 0 || BG.legalNext(G.pos, G.turn, G.rem).length === 0) {
      if (G.rem.length && BG.winnerOf(G.pos) < 0) say('No further legal moves.');
      G.phase = 'ending'; view.movable = []; G.movable = new Set(); updateActions(); signal('moves');
      return;
    }
    refreshHighlights(); updateActions(); maybeAssist();
  }
  function refreshHighlights() {
    G.legal = BG.legalNext(G.pos, G.turn, G.rem);
    G.movable = new Set(G.legal.map(m => m.from));
    view.movable = Array.from(G.movable); view.turnPlayer = G.turn;
    if (view.sel !== null) { if (!G.movable.has(view.sel)) selectFrom(null); else selectFrom(view.sel, true); }
  }
  function computeDests(from) {
    const p = G.turn, out = new Map();
    const rec = (pos, rem, cur, path) => {
      const ms = BG.legalNext(pos, p, rem).filter(m => m.from === cur);
      for (const m of ms) {
        const np = BG.applyMove(pos, p, m), r2 = rem.slice(); r2.splice(r2.indexOf(m.die), 1);
        const path2 = path.concat([m]);
        const hitMid = path2.slice(0, -1).some(x => x.hit);
        const ex = out.get(m.to);
        if (!ex || path2.length < ex.path.length || (path2.length === ex.path.length && ex.hitMid && !hitMid)) out.set(m.to, { to: m.to, hit: path2.some(x => x.hit), path: path2, hitMid });
        if (m.to !== BG.OFF && r2.length) rec(np, r2, m.to, path2);
      }
    };
    rec(G.pos, G.rem, from, []);
    return Array.from(out.values());
  }
  function selectFrom(from, silent) {
    view.sel = from;
    if (from === null) { G.dests = []; view.dests = []; return; }
    G.dests = computeDests(from);
    view.dests = G.dests.map(d => ({ to: d.to, hit: d.hit }));
    if (!silent) SFX.select();
  }
  function destAt(h) {
    if (!h || view.sel === null) return null;
    for (const d of G.dests) {
      if (h.type === 'point' && d.to === h.i) return d;
      if (h.type === 'off' && d.to === BG.OFF && h.p === G.turn) return d;
    }
    return null;
  }
  async function performDest(d, dragXY) {
    if (G.busy) return;
    const id = G.runId;
    G.busy = true; // block input during multi-step path
    let first = true;
    for (const m of d.path) {
      G.busy = false;
      await doMove(m, { from: first ? dragXY : undefined, quiet: true });
      if (!alive(id)) return;
      first = false;
      if (d.path.length > 1) await view.wait(60);
    }
    afterHumanMove();
  }
  function autoMove(from) {
    selectFrom(from, true);
    const ds = G.dests.slice().sort((a, b) => a.path.length - b.path.length || (b.path[0].die - a.path[0].die));
    if (ds.length) performDest(ds[0]);
  }

  function undo() {
    if (G.busy || G.phase !== 'moving' || !G.history.length || !isHuman(G.turn)) return;
    const h = G.history.pop();
    G.pos = h.pos; G.rem = h.rem; G.stats = h.stats;
    if (G.pos.shield !== (G.shieldNow || undefined)) { G.pos = Object.assign(BG.clone(G.pos), { total: G.pos.total, shield: G.shieldNow }); }
    view.setPos(G.pos); view.setDiceRemaining(G.rem); view.sel = null; view.dests = []; view.hint = null;
    SFX.click(); updateHUD(); refreshHighlights(); updateActions();
  }
  function hint() {
    if (G.busy || G.phase !== 'moving' || !isHuman(G.turn)) return;
    const r = AI.chooseTurn(G.pos, G.turn, G.rem.slice(), { level: 5, exact: true });
    if (r.moves.length) { view.hint = r.moves[0]; SFX.select(); }
  }

  /* ---------- input ---------- */
  function ptPos(e) { const r = $('#board').getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onDown(e) {
    SFX.resume();
    if (!G.active || G.busy) return;
    const { x, y } = ptPos(e), h = view.hitTest(x, y);
    G.ptr = { x, y, h, dragging: false, from: null, wasSel: false };
    if (!isHuman(G.turn)) { G.ptr = null; return; }
    if (G.phase === 'preroll' || G.phase === 'opening') {
      if (h && h.type === 'cube') { if (canDouble(G.turn)) signal('preroll', 'double'); else SFX.error(); }
      else signal('preroll', 'roll');
      G.ptr = null; return;
    }
    if (G.phase !== 'moving') { G.ptr = null; return; }
    try { e.target.setPointerCapture(e.pointerId); } catch (_) { }
    const p = G.turn;
    if (view.sel !== null) {
      const d = destAt(h);
      if (d) { G.ptr = null; performDest(d); return; }
    }
    let from = null;
    if (h && h.type === 'bar' && h.p === p && G.pos.bar[p] > 0) from = BG.BAR;
    else if (h && h.type === 'point' && BG.cnt(G.pos, p, h.i) > 0) from = h.i;
    if (from !== null && G.movable.has(from)) {
      const now = performance.now();
      if (G.lastTap && G.lastTap.from === from && now - G.lastTap.t < 380 && view.sel === from) { G.lastTap = null; G.ptr = null; autoMove(from); return; }
      G.lastTap = { from, t: now };
      G.ptr.from = from; G.ptr.wasSel = view.sel === from;
      selectFrom(from, view.sel === from);
    } else {
      if (from !== null) SFX.error();
      selectFrom(null); G.ptr = null;
    }
  }
  function onMove(e) {
    if (!G.active) return;
    const { x, y } = ptPos(e);
    if (G.ptr && G.ptr.from !== null && !G.ptr.dragging && Math.hypot(x - G.ptr.x, y - G.ptr.y) > 7) {
      G.ptr.dragging = true; view.beginDrag(G.turn, G.ptr.from, 0, 0);
    }
    if (G.ptr && G.ptr.dragging) view.moveDrag(x, y);
    const h = view.hitTest(x, y);
    const cv = $('#board');
    let cur = 'default';
    if (G.phase === 'moving' && isHuman(G.turn)) {
      if (h && ((h.type === 'point' && G.movable.has(h.i) && BG.cnt(G.pos, G.turn, h.i) > 0) || destAt(h))) cur = 'pointer';
    } else if ((G.phase === 'preroll' || G.phase === 'opening') && isHuman(G.turn)) cur = 'pointer';
    cv.style.cursor = cur;
  }
  function onUp(e) {
    const ptr = G.ptr; G.ptr = null;
    if (!ptr || !G.active) return;
    const { x, y } = ptPos(e);
    if (ptr.dragging) {
      const d = view.endDrag(), h = view.hitTest(x, y), dest = destAt(h);
      if (dest) performDest(dest, { x: d.x, y: d.y, lift: d.lift || 0 });
      return;
    }
    if (ptr.from !== null && ptr.wasSel) selectFrom(null);
  }
  function onKey(e) {
    if (Nav.cur !== 'game' || !G.active || $('#modal-root').children.length) return;
    const k = e.key.toLowerCase();
    if ((k === ' ' || k === 'enter') && (G.phase === 'preroll' || G.phase === 'opening') && isHuman(G.turn)) { e.preventDefault(); signal('preroll', 'roll'); }
    else if (k === 'u') undo();
    else if (k === 'h') hint();
    else if (k === 'd' && canDouble(G.turn) && isHuman(G.turn)) signal('preroll', 'double');
  }


  /* ---------- Wild mode: perks ---------- */
  function setShield(p, on) {
    const sh = (G.pos.shield || [false, false]).slice(); sh[p] = on;
    G.shieldNow = sh[0] || sh[1] ? sh : undefined;
    G.pos = Object.assign(BG.clone(G.pos), { total: G.pos.total, shield: G.shieldNow });
    if (view) view.setPos(G.pos);
  }
  function perkState(p, id) {
    const pk = Wild.byId(id);
    if (!G.charges[p].has(id)) return { ok: false, why: 'Used this game' };
    if (G.perkTurn) return { ok: false, why: 'One perk per turn' };
    if (!G.active || G.turn !== p || G.busy) return { ok: false, why: 'Not now' };
    const opp = 1 - p;
    if (pk.when === 'dice') {
      if (G.phase !== 'moving' || G.history.length || !G.turnStart) return { ok: false, why: 'Right after you roll, before you move' };
      const d = G.turnStart.dice;
      if (id === 'twin' && (d.length === 4 || d[0] === d[1])) return { ok: false, why: 'You already rolled a double' };
      if (id === 'bonus' && d.length !== 2) return { ok: false, why: 'Not on doubles' };
      if (id === 'twin' || id === 'nudge') return { ok: true };
      return { ok: true };
    }
    if (G.phase !== 'preroll' && G.phase !== 'moving') return { ok: false, why: 'Not now' };
    if (id === 'peek' && (G.peek[opp] || G.hex[opp])) return { ok: false, why: 'Already set for their next roll' };
    if (id === 'hex' && (G.hex[opp] || G.peek[opp])) return { ok: false, why: 'Already set for their next roll' };
    if (id === 'shield' && G.pos.shield && G.pos.shield[p]) return { ok: false, why: 'Already active' };
    return { ok: true };
  }
  function renderPerks() {
    const bar = $('#perkbar'); if (!bar) return;
    if (!G.cfg || !G.cfg.wild) { if (!bar.hidden) { bar.hidden = true; bar._h = ''; } return; }
    const mine = G.perkIds[0].map(id => {
      const pk = Wild.byId(id), st = perkState(0, id), spent = !G.charges[0].has(id);
      return `<button type="button" class="perk ${spent ? 'spent' : ''}" data-perk="${id}" ${st.ok ? '' : 'disabled'} title="${esc(pk.name + ': ' + pk.blurb + (st.why && !spent ? ' (' + st.why + ')' : ''))}"><span class="pk-ico">${pk.icon}</span><span class="pk-name">${pk.name}</span></button>`;
    }).join('');
    const theirs = G.perkIds[1].map(id => { const spent = !G.charges[1].has(id), pk = Wild.byId(id); return `<span class="perk-opp ${spent ? 'spent' : ''}" title="${spent ? esc(pk.name) + ' (used)' : 'Hidden perk'}">${spent ? pk.icon : '?'}</span>`; }).join('');
    let note = '';
    if (G.peek[1]) note = `Their next roll: ${G.peek[1][0]} and ${G.peek[1][1]}`;
    else if (G.hex[1]) note = 'Hex set on ' + G.cfg.names[1];
    else if (G.hex[0]) note = 'You are hexed: you roll twice and keep the lower';
    const h = `<div class="perk-side">${mine}</div>${note ? `<span class="perk-note">${esc(note)}</span>` : ''}<div class="perk-side opp"><small>${esc(G.cfg.names[1])}</small>${theirs}</div>`;
    if (bar._h !== h) { bar._h = h; bar.innerHTML = h; }
    bar.hidden = false;
  }

  // apply a perk for player p. For nudge/twin, `arg` is the new pair of dice.
  async function perkApply(p, id, arg) {
    const rid = G.runId, pk = Wild.byId(id), name = G.cfg.names[p], opp = 1 - p;
    G.busy = true; G.perkTurn = true; G.charges[p].delete(id); updateActions();
    SFX.cube(); banner(pk.icon + ' ' + pk.name);
    say(esc(name) + ' plays <b>' + esc(pk.name) + '</b>. <small>' + esc(pk.blurb) + '</small>');
    const dice = G.turnStart ? G.turnStart.dice : [];
    const pair = dice.length === 4 ? [dice[0], dice[0]] : dice.slice(0, 2);
    const refit = () => { if (G.turnStart) G.turnStart.dice = G.rem.slice(); view.setDiceRemaining(G.rem); };
    if (id === 'reroll') {
      const a = BG.rollDie(), b = BG.rollDie();
      await view.throwDice([{ value: a, side: p }, { value: b, side: p }]); if (!alive(rid)) return;
      G.rem = BG.diceToList(a, b); refit();
    } else if (id === 'nudge' || id === 'twin') {
      const nv = arg || pair;
      for (let i = 0; i < 2; i++) if (view.dice[i] && view.dice[i].value !== nv[i]) view.setDieValue(i, nv[i]);
      await view.wait(450); if (!alive(rid)) return;
      G.rem = BG.diceToList(nv[0], nv[1]); refit();
    } else if (id === 'bonus') {
      const v = BG.rollDie();
      await view.throwDice([{ value: pair[0], side: p }, { value: pair[1], side: p }, { value: v, side: p }]); if (!alive(rid)) return;
      G.rem = [pair[0], pair[1], v]; refit();
    } else if (id === 'hex') {
      G.hex[opp] = true; await view.wait(500);
    } else if (id === 'peek') {
      G.peek[opp] = [BG.rollDie(), BG.rollDie()]; await view.wait(500);
      say(esc(G.cfg.names[opp]) + ' will roll <b>' + G.peek[opp][0] + '</b> and <b>' + G.peek[opp][1] + '</b>.');
    } else if (id === 'shield') {
      setShield(p, true); await view.wait(500);
    }
    if (!alive(rid)) return;
    G.busy = false; updateActions();
    if (isHuman(p) && G.phase === 'moving') {
      if (['reroll', 'nudge', 'twin', 'bonus'].includes(id)) {
        if (!BG.legalNext(G.pos, G.turn, G.rem).length) { say('No legal move with those dice.'); G.phase = 'ending'; view.movable = []; G.movable = new Set(); updateActions(); signal('moves'); }
        else { refreshHighlights(); maybeAssist(); }
      }
    }
  }
  async function aiPerksPre(id) {
    const have = Array.from(G.charges[G.turn]);
    const dec = Wild.decideAny(G.pos, G.turn, have, 'pre', G.track.cur ? G.track.cur.turns : 0);
    if (dec) await perkApply(G.turn, dec.id);
  }
  async function usePerkUI(id) {
    const st = perkState(0, id); if (!st.ok) { if (st.why) toast(st.why); return; }
    const d = G.turnStart ? G.turnStart.dice : [], pair = d.length === 4 ? [d[0], d[0]] : d.slice(0, 2);
    if (id === 'nudge') {
      const opts = [];
      [0, 1].forEach(i => [-1, 1].forEach(dv => { const v = pair[i] + dv; if (v >= 1 && v <= 6) opts.push({ label: pair[i] + ' to ' + v + (pair[0] === pair[1] ? '' : ' (die ' + (i + 1) + ')'), value: i === 0 ? [v, pair[1]] : [pair[0], v], key: i + ':' + v }); }));
      const uniq = opts.filter((o, i) => opts.findIndex(q => q.value.join() === o.value.join()) === i);
      const r = await ask({ title: 'Nudge a die', text: 'Your roll is <b>' + pair[0] + '</b> and <b>' + pair[1] + '</b>. Move one die by a single pip.', buttons: [{ label: 'Cancel', value: null }].concat(uniq.map(o => ({ label: o.label, value: o.value, cls: 'primary' }))) });
      if (!r) return; return perkApply(0, id, r);
    }
    if (id === 'twin') {
      const r = await ask({ title: 'Twin', text: 'Your roll is <b>' + pair[0] + '</b> and <b>' + pair[1] + '</b>. Make both dice the same and play it as a double.', buttons: [{ label: 'Cancel', value: null }, { label: 'Both ' + pair[0], value: [pair[0], pair[0]], cls: 'primary' }, { label: 'Both ' + pair[1], value: [pair[1], pair[1]], cls: 'primary' }] });
      if (!r) return; return perkApply(0, id, r);
    }
    return perkApply(0, id);
  }

  /* ---------- doubling cube ---------- */
  async function doDouble(id, p) {
    const c = G.cfg, newVal = G.cube.value * 2, opp = 1 - p;
    G.phase = 'doubling'; updateActions();
    G.track.cube(p, 'offer');
    if (online() && p === 0) Net.send('double', { v: newVal });
    SFX.cube(); banner(c.names[p] + ' doubles to ' + newVal);
    say(esc(c.names[p]) + ' offers the cube at ' + newVal + '.');
    let take;
    if (isHuman(opp)) {
      await view.wait(500);
      const r = await ask({
        title: esc(c.names[p]) + ' doubles',
        text: 'The cube goes to <b>' + newVal + '</b>. ' + (c.mode === '2p' ? esc(c.names[opp]) + ', do you take? ' : 'Take it and play on for double the stakes, or pass and give up this game.') + (c.mode === '2p' ? '' : ''),
        extra: '<div class="reward-note">Pass costs ' + G.cube.value + ' point' + (G.cube.value > 1 ? 's' : '') + '. Taking risks ' + newVal + '.</div>',
        buttons: [{ label: 'Pass (lose ' + G.cube.value + ')', value: 'pass' }, { label: 'Take', value: 'take', cls: 'primary' }],
      });
      take = r === 'take';
      if (online()) Net.send('reply', { take });
    } else if (online()) {
      await view.wait(500);
      const m = await Net.next(['reply']);
      if (!alive(id)) return 'pass';
      if (!m) return 'gone';
      take = !!m.take;
    } else {
      await view.wait(1100);
      take = G.cheat.aiPass ? false : AI.shouldTake(G.pos, opp, { level: c.level, style: c.style });
      if (G.cheat.aiPass) G.cheated = true;
    }
    if (!alive(id)) return 'pass';
    G.track.cube(opp, take ? 'take' : 'pass');
    if (take) {
      G.cube = { value: newVal, owner: opp };
      view.setCube({ value: newVal, owner: opp, glow: false });
      SFX.cube(); banner(c.names[opp] + ' takes');
      G.phase = 'preroll'; updateHUD(); updateActions();
      await view.wait(700);
      return 'take';
    }
    banner(c.names[opp] + ' passes');
    await view.wait(900);
    return 'pass';
  }

  /* ---------- game end ---------- */
  async function finishGame(id, w, how) {
    const c = G.cfg;
    G.phase = 'over'; view.sel = null; view.dests = []; view.movable = []; view.hint = null;
    const base = how === 'pass' ? 1 : (c.gammons ? BG.gameValue(G.pos, w) : 1);
    const cv = G.cube.value, pts = base * cv;
    G.score[w] += pts; G.stats.games++;
    const gs = G.track.endGame({ winner: w, base, pts, cv, how });
    if (c.mode !== '2p' && w === 0) {
      if (base === 2) G.stats.gammons++;
      if (base === 3) G.stats.backgammons++;
      G.stats.cubeWin = Math.max(G.stats.cubeWin, cv);
      G.stats.pointsWon += pts;
      G.stats.oppLeft = how === 'pass' ? BG.total(G.pos) : BG.total(G.pos) - G.pos.off[1];
    }
    updateHUD(); updateActions();
    const humanWon = c.mode === '2p' ? true : w === 0;
    humanWon ? SFX.win() : SFX.lose();
    if (humanWon) view.celebrate();
    banner(base === 3 ? 'Backgammon!' : base === 2 ? 'Gammon!' : how === 'pass' ? 'Double declined' : (humanWon && c.mode !== '2p' ? 'You win!' : c.mode === '2p' ? c.names[w] + ' wins' : c.names[1] + ' wins'));
    await view.wait(1500);
    if (!alive(id)) return;
    if (c.mode === '2p' || w === 0) G.gamesWon++; else G.gamesLost++;
    let gx = 0, gc = 0;
    if (!G.cheated) {
      const gr = DATA.gameReward({ mode: c.mode, level: c.level, variant: c.variant, won: humanWon });
      gx = gr.xp; gc = gr.coins;
      P().xp += gx; P().coins += gc; P().stats.coinsEarned += gc; G.gameXP += gx; G.gameCoins += gc; Store.save(); refreshCoins();
    }
    const matchOver = G.score[w] >= c.matchLen;
    if (matchOver) return 'match';
    const kind = base === 3 ? 'a backgammon' : base === 2 ? 'a gammon' : 'the game';
    const rwNote = G.cheated ? '<div class="reward-note">Cheats are active, so this match pays no rewards.</div>' : '<div class="reward-note"><span>Game reward</span><span class="chip"><b>+' + gx + '</b> XP</span><span class="coin">+' + gc + '</span><span>Win the match for a bonus, plus extra for a long match or a clean sweep.</span></div>';
    await new Promise((res) => modal({
      dismiss: false, wide: true,
      html: `<h2>${esc(c.names[w])}${c.mode !== '2p' && w === 0 ? ' win ' : ' wins '}${kind}</h2>
        <p class="lead">${pts} point${pts > 1 ? 's' : ''}${cv > 1 ? ' (cube ' + cv + ')' : ''}. Score: ${esc(c.names[0])} ${G.score[0]}, ${esc(c.names[1])} ${G.score[1]}. First to ${c.matchLen}.</p>
        ${Stats.tabsHTML(['Result', 'Game stats'])}
        <div class="st-pane" data-pane="0">${rwNote}</div><div class="st-pane" data-pane="1" hidden>${Stats.gamePanel(G.track, gs)}</div>
        <div class="btns"><button class="btn primary" data-act="next">Next game</button></div>`,
      actions: { next: () => { res(1); } },
      after: Stats.wireTabs,
    }));
    return 'next';
  }

  /* ---------- rewards & results ---------- */
  function finalizeMatch() {
    const c = G.cfg, st = G.stats, p = P();
    const res = { mode: c.mode, cheated: !!G.cheated, score: G.score.slice() };
    const li0 = G.levelAtStart;
    if (!G.cheated) p.stats.played++;
    if (c.mode === '2p') {
      res.winner = G.score[0] > G.score[1] ? 0 : 1; res.won = true;
    } else {
      res.won = G.score[0] > G.score[1];
      if (!G.cheated) {
        if (res.won) { p.stats.won++; p.stats.streak++; p.stats.bestStreak = Math.max(p.stats.bestStreak, p.stats.streak); } else p.stats.streak = 0;
        p.stats.gammons += st.gammons; p.stats.hits += st.hits;
      }
    }
    const input = { mode: c.mode, level: c.level, variant: c.variant, matchLen: c.matchLen, won: res.won, games: st.games, gamesLost: G.gamesLost, gammons: st.gammons, backgammons: st.backgammons, cubeMax: st.cubeWin, points: G.score[0], stage: c.stage };
    if (c.mode === 'campaign' && !G.cheated) {
      const stage = c.stage;
      const ev = { won: res.won, hits: st.hits, hurt: st.hurt, gammons: st.gammons, oppLeft: st.oppLeft, turns: st.turns, cubeWin: st.cubeWin, oppScore: G.score[1] };
      const done = stage.objectives.map(o => DATA.objDone(o, ev));
      const prev = p.campaign[stage.id] || { stars: [false, false, false], plays: 0 };
      input.newStars = done.map((d, i) => d && !prev.stars[i]);
      input.firstClear = res.won && !prev.stars[0];
      res.done = done; res.prev = prev.stars.slice();
      p.campaign[stage.id] = { stars: done.map((d, i) => d || prev.stars[i]), plays: prev.plays + 1 };
    }
    res.bossSet = null;
    if (c.mode === 'campaign' && c.stage.boss && res.won && !G.cheated && DATA.BOSS_SETS[c.stage.id]) {
      const bs = DATA.BOSS_SETS[c.stage.id], slotCat = { board: 'boards', checkers: 'checkers', dice: 'dice', moveFx: 'moveFx', throwFx: 'throwFx' };
      let fresh = false;
      for (const slot in slotCat) { const cat = slotCat[slot]; if (!p.owned[cat].includes(bs[slot])) { p.owned[cat].push(bs[slot]); fresh = true; } }
      if (fresh) res.bossSet = bs;
    }
    if (!G.cheated && c.mode !== '2p' && c.mode !== 'online') Stats.record(G.track, res);
    res.rw = G.cheated ? { xp: 0, coins: 0, lines: [['Cheats used: no match rewards', 0, 0]] } : DATA.rewardFor(input);
    if (c.mode === 'campaign' && G.cheated) { res.done = c.stage.objectives.map(() => false); }
    p.xp += res.rw.xp; p.coins += res.rw.coins; p.stats.coinsEarned += res.rw.coins;
    const li1 = DATA.levelInfo(p.xp).level;
    res.levelBefore = li0; res.levelAfter = li1; res.levelCoins = 0; res.unlocked = [];
    for (let L = li0 + 1; L <= li1; L++) res.levelCoins += DATA.levelBonusCoins(L);
    p.coins += res.levelCoins;
    for (const cat in DATA.CATS) for (const it of DATA.CATS[cat].items) if (it.lvl > li0 && it.lvl <= li1 && !p.owned[cat].includes(it.id)) res.unlocked.push(it.name);
    Store.save();
    return res;
  }

  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#5bdc92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.500l2.800 2.800L16 9.500"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="#6e7f76" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg>';
  const STAR = (on) => `<svg viewBox="0 0 24 24" class="${on ? 'on' : 'off'}" style="width:22px;height:22px"><path d="M12 2.500l2.900 6 6.600.9-4.800 4.600 1.200 6.500L12 17.400l-5.900 3.100 1.200-6.500L2.500 9.400l6.600-.9L12 2.500Z"/></svg>`;

  async function showMatchResult(id) {
    const c = G.cfg;
    G.phase = 'over';
    const res = finalizeMatch();
    refreshCoins();
    const lines = res.rw.lines.slice();
    if (G.gameXP || G.gameCoins) lines.push(['Games played (' + G.stats.games + ')', G.gameXP, G.gameCoins]);
    const rows = lines.map(l => `<tr><td>${esc(l[0])}</td><td>+${fmt(l[1])} XP</td><td><span class="coin">${fmt(l[2])}</span></td></tr>`).join('');
    const total = `<tr class="total"><td>Total</td><td>+${fmt(res.rw.xp + G.gameXP)} XP</td><td><span class="coin">${fmt(res.rw.coins + G.gameCoins)}</span></td></tr>`;
    const li = DATA.levelInfo(P().xp);
    let title, lead, extra = '';
    if (c.mode === '2p') { title = esc(c.names[res.winner]) + ' wins the match'; lead = G.score[0] + ' to ' + G.score[1] + '. Both players share the rewards on this device.'; }
    else if (res.won) { title = c.mode === 'campaign' ? 'Stage cleared' : 'Victory'; lead = 'You beat ' + esc(c.names[1]) + ' ' + G.score[0] + ' to ' + G.score[1] + '.' + (c.stage ? ' <i>' + esc(rivalLine(c.stage, true)) + '</i>' : ''); }
    else { title = 'Defeat'; lead = esc(c.names[1]) + ' wins ' + G.score[1] + ' to ' + G.score[0] + '. Better luck next time.' + (c.stage ? ' <i>' + esc(rivalLine(c.stage, false)) + '</i>' : ''); }
    if (c.mode === 'campaign') {
      const stage = c.stage;
      extra += '<div style="margin:12px 0 4px">' + stage.objectives.map((o, i) => `<div class="obj ${res.done[i] ? 'done' : ''}">${res.done[i] ? CHECK : CROSS}<span style="flex:1">${esc(DATA.objText(o))}</span>${STAR(res.done[i])}</div>`).join('') + '</div>';
    }
    if (res.levelAfter > res.levelBefore) {
      extra += `<div class="levelup"><b>Level ${res.levelAfter}</b><div>${DATA.rankFor(res.levelAfter)} · +${fmt(res.levelCoins)} bonus coins</div>${res.unlocked.length ? '<div style="color:var(--mute);margin-top:4px">New in the shop: ' + esc(res.unlocked.join(', ')) + '</div>' : ''}</div>`;
      SFX.levelUp();
    }
    if (res.bossSet) {
      const bs = res.bossSet, names = [DATA.find('boards', bs.board).name, DATA.find('checkers', bs.checkers).name, DATA.find('dice', bs.dice).name, DATA.find('moveFx', bs.moveFx).name, DATA.find('throwFx', bs.throwFx).name];
      extra += `<div class="levelup" style="border-color:#ff9d3d"><b style="color:#ffb86b">${esc(bs.name)} unlocked</b><div style="color:var(--mute);margin-top:4px">${names.map(esc).join(' · ')}</div><button class="btn small primary" style="margin-top:10px" data-act="equipset" data-keep>Equip the whole set</button></div>`;
      SFX.levelUp();
    }
    const stage = c.stage, nextStage = stage && DATA.STAGES[stage.n + 1];
    const btns = [];
    if (c.mode === 'campaign') {
      btns.push(`<button class="btn" data-act="map">Campaign map</button>`);
      btns.push(`<button class="btn" data-act="again">Retry</button>`);
      if (res.won && nextStage) btns.push(`<button class="btn primary" data-act="next">Next stage</button>`);
    } else {
      btns.push(`<button class="btn" data-act="menu">Menu</button>`);
      btns.push(`<button class="btn primary" data-act="again">Rematch</button>`);
      if (c.mode === 'online') G.matchDone = true;
    }
    modal({
      dismiss: false,
      wide: true,
      html: `<h2>${title}</h2><p class="lead">${lead}</p>${Stats.tabsHTML(['Rewards', 'Match stats'])}
        <div class="st-pane" data-pane="0">${extra}
        <table class="rw-table">${rows}${total}</table>
        <div class="xpbar"><i style="width:${Math.round(100 * li.into / li.need)}%"></i></div>
        <div style="display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px"><span>Level ${li.level} · ${DATA.rankFor(li.level)}</span><span>${li.max ? 'Max' : fmt(li.into) + ' / ' + fmt(li.need) + ' XP'}</span></div></div>
        <div class="st-pane" data-pane="1" hidden>${Stats.matchPanel(G.track)}</div>
        <div class="btns">${btns.join('')}</div>`,
      after: Stats.wireTabs,
      actions: {
        menu: () => { show('menu'); },
        map: () => { show('campaign'); },
        again: (api, b) => { if (c.mode === 'online') { if (Net.left) return false; Net.voteRematch(); b.disabled = true; b.textContent = 'Waiting for ' + c.names[1] + '…'; return false; } start(Object.assign({}, c)); },
        equipset: (api, b) => { const bs = res.bossSet; Object.assign(P().equipped, { board: bs.board, checkers: bs.checkers, dice: bs.dice, moveFx: bs.moveFx, throwFx: bs.throwFx }); Store.save(); toast(bs.name + ' equipped'); b.disabled = true; b.textContent = 'Equipped'; return false; },
        next: () => { startStage(nextStage); },
      },
    });
  }

  /* ---------- in-game menu ---------- */
  function openGameMenu() {
    if (!G.active) return;
    modal({
      html: `<h2>Paused</h2><p class="lead">${online() ? 'Leaving ends the match and ' + esc(G.cfg.names[1]) + ' wins. The game keeps running for them while this is open.' : 'Quit now and this match ends with no rewards.'}</p>
        <div class="btns"><button class="btn danger" data-act="quit">Quit match</button>${Device.fsOK() ? `<button class="btn" data-act="fs">${Device.isFull() ? 'Exit fullscreen' : 'Fullscreen'}</button>` : ''}${online() ? '' : '<button class="btn" data-act="cheats">Cheats</button>'}<button class="btn" data-act="settings">Settings</button><button class="btn primary" data-act="resume">Resume</button></div>`,
      actions: {
        resume: () => { },
        fs: () => { Device.toggleFullscreen(); },
        settings: () => { setTimeout(openSettings, 0); },
        cheats: () => { setTimeout(openCheats, 0); },
        quit: () => { show(G.cfg.mode === 'campaign' ? 'campaign' : 'menu'); },
      },
    });
  }

  return {
    start, leaveBoard, usePerk: usePerkUI, get view() { return view; }, get G() { return G; }, get cheat() { return G.cheat; }, get active() { return G.active; }, fit,
    startStage: (s) => startStage(s),
  };
})();

function startStage(stage) {
  Game.start({
    mode: 'campaign', stage, level: stage.level, style: stage.style, variant: stage.variant, matchLen: stage.matchLen, cube: stage.cube, gammons: true,
    names: ['You', stage.name], avs: ['🎲', stage.av], subs: ['', stage.title], faces: ['player', 's' + stage.num], scene: stage.chapter,
  });
}

/* ---------- setup ---------- */

}
function renderSetup() {

function buyItem(cat, it) {
  const p = P(), lvl = levelNow();
  if (owns(cat, it.id)) return;
  if (it.boss) { SFX.error(); toast('Beat the chapter boss to earn this'); return; }
  if (it.lvl > lvl) { SFX.error(); toast('Reach level ' + it.lvl + ' to unlock this'); return; }
  if (p.coins < it.price) { SFX.error(); toast('You need ' + fmt(it.price - p.coins) + ' more coins'); return; }
  p.coins -= it.price; p.owned[cat].push(it.id); p.equipped[DATA.CATS[cat].slot] = it.id;
  Store.save(); SFX.buy(); toast(it.name + ' purchased and equipped'); renderShop();
}
function equipItem(cat, id) { P().equipped[DATA.CATS[cat].slot] = id; Store.save(); SFX.click(); renderShop(); }
function wireShop() {
  $('#shop-tabs').addEventListener('click', (e) => { const t = e.target.closest('.tab'); if (!t) return; Shop.cat = t.dataset.cat; Shop.rar = 'all'; SFX.click(); renderShop(); $('#shop-body').scrollTop = 0; });
  $('#shop-filters').addEventListener('click', (e) => { const b = e.target.closest('.fchip'); if (!b) return; if (b.dataset.rar) Shop.rar = b.dataset.rar; if (b.dataset.show) Shop.show = b.dataset.show; SFX.click(); renderShop(); $('#shop-body').scrollTop = 0; });
  $('#shop-body').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-do]'); if (!b) return;
    const it = DATA.find(Shop.cat, b.dataset.id);
    if (b.dataset.do === 'buy') buyItem(Shop.cat, it);
    else if (b.dataset.do === 'equip') equipItem(Shop.cat, it.id);
    else if (b.dataset.do === 'preview') { SFX.click(); openPreview(Shop.cat, it); }
  });
}
Nav.onShow.shop = () => renderShop();

/* a large close-up of an inlay, trim or mat, cropped from the board rendered at high resolution */
function drawZoom(cv, cat, it, W) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), k = 2.2, e = P().equipped;
  const cos = { board: e.board, trim: cat === 'trims' ? it.id : 'none', inlay: cat === 'inlays' ? it.id : 'none', mat: cat === 'mats' ? it.id : 'none' };
  const th = DATA.themeFor(cos), tmp = GFX.mkCanvas(GEO.W * k, GEO.H * k); GFX.renderBoard(tmp, th, k);
  const cssW = Math.max(260, Math.min(W, cat === 'inlays' ? 380 : 520)), cssH = cat === 'inlays' ? cssW : Math.round(cssW * 0.5);
  cv.width = cssW * dpr; cv.height = cssH * dpr; cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  const c = cv.getContext('2d'); c.imageSmoothingQuality = 'high';
  let sw, sh, sx, sy;
  if (cat === 'inlays') { const r = (it.size || 62) * 1.08; sw = sh = 2 * r; sx = GEO.xr + 3 * GEO.pw - r; sy = GEO.mid - r; }
  else if (cat === 'trims') { sw = 300; sh = 150; sx = 0; sy = 0; }
  else { sw = 420; sh = 210; sx = GEO.xr + 3 * GEO.pw - 210; sy = GEO.mid - 105; }
  c.drawImage(tmp, sx * k, sy * k, sw * k, sh * k, 0, 0, cv.width, cv.height);
}
function openPreview(cat, it) {
  let live = true, v = null;
  const own = owns(cat, it.id), lvl = levelNow();
  const m = modal({
    wide: true,
    html: `<h2>${esc(it.name)}</h2><p class="lead">${esc(it.desc)}</p><div class="preview-stage"><canvas id="pv-canvas"></canvas></div>${(cat === 'inlays' || cat === 'trims' || cat === 'mats') ? '<div class="preview-stage zoom"><canvas id="pv-zoom"></canvas><span class="zoom-tag">Close-up</span></div>' : ''}
      <div class="btns"><button class="btn" data-act="close">Close</button>${own ? (equippedId(cat) === it.id ? '' : '<button class="btn primary" data-act="equip">Equip</button>') : (it.boss ? `<button class="btn" disabled>Boss reward</button>` : it.lvl > lvl ? `<button class="btn" disabled>Unlocks at level ${it.lvl}</button>` : `<button class="btn primary" data-act="buy">Buy · ${fmt(it.price)}</button>`)}</div>`,
    onClose: () => { live = false; if (v) v.stop(); },
    actions: { close: () => { }, equip: () => { equipItem(cat, it.id); }, buy: () => { buyItem(cat, it); } },
  });
  const zc = $('#pv-zoom', m.el);
  if (zc) setTimeout(() => { try { drawZoom(zc, cat, it, Math.min(660, m.el.clientWidth - 48)); } catch (err) { zc.parentNode.style.display = 'none'; } }, 30);
  const cv = $('#pv-canvas', m.el);
  v = makeView(cv, { small: true }); v.numbers = false;
  v.fit(Math.min(660, m.el.clientWidth - 48), 380);
  const e = P().equipped;
  const cos = { board: e.board, checkers: e.checkers, dice: e.dice, moveFx: e.moveFx, throwFx: e.throwFx, trim: e.trim, inlay: e.inlay, mat: e.mat, cube: e.cube };
  cos[DATA.CATS[cat].slot] = it.id; v.setCosmetics(cos);
  if (cat === 'cubes') v.setCube({ show: true, value: 2, owner: 0, glow: false });
  v.snd = (n, a) => { if (SFX[n]) SFX[n](a); };
  v.start();
  (async () => {
    while (live) {
      const pos = BG.startPos('classic'); v.clearDice(); v.setPos(pos); v.turnPlayer = 0;
      await v.wait(500); if (!live) break;
      let d1, d2; do { d1 = BG.rollDie(); d2 = BG.rollDie(); } while (d1 === d2);
      await v.throwDice([{ value: d1, side: 0 }, { value: d2, side: 0 }]); if (!live) break;
      const r = AI.chooseTurn(pos, 0, BG.diceToList(d1, d2), { level: 3 });
      await v.wait(400);
      for (const mv of r.moves) { if (!live) break; await v.moveChecker(mv, 0); await v.wait(160); }
      await v.wait(1500);
    }
  })();
}
