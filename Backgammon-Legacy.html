  };
  const waitingRoom = (code) => {
    body().innerHTML = `<p class="lead" style="margin-top:0">Share this code with your friend. They choose <b>Join a game</b> and type it in.</p>
      <div class="on-code" id="on-code">${esc(code)}</div>
      <div class="msg-line" id="on-status">Waiting for a friend to join…</div>
      <div class="btns"><button class="btn" data-go="copy" data-from="on-code">Copy code</button><button class="btn danger" data-go="cancel">Cancel</button></div>`;
  };
  const waitingP2P = (code) => {
    body().innerHTML = `<p class="lead" style="margin:0 0 6px"><b>1.</b> Send this code to your friend, in any message.</p>
      <textarea class="on-text" id="on-offer" readonly rows="4">${esc(code)}</textarea>
      <div class="btns" style="margin-top:6px"><button class="btn small" data-go="copy" data-from="on-offer">Copy code</button></div>
      <p class="lead" style="margin:12px 0 6px"><b>2.</b> They will send a reply code back. Paste it here.</p>
      <textarea class="on-text" id="on-reply" rows="3" placeholder="Paste the reply code"></textarea>
      <div class="msg-line" id="on-status">Waiting for the reply code…</div>
      <div class="btns"><button class="btn danger" data-go="cancel">Cancel</button><button class="btn primary" data-go="connect">Connect</button></div>`;
  };
  const joinRoomView = () => {
    body().innerHTML = `<p class="lead" style="margin-top:0">Type the 4-letter code your friend sees.</p>
      <input id="on-join" class="on-join" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="msg-line" id="on-status"></div>
      <div class="btns"><button class="btn" data-go="home">Back</button><button class="btn primary" data-go="doJoin">Join</button></div>`;
    setTimeout(() => { const i = $('#on-join', api.el); if (i) i.focus(); }, 40);
  };
  const joinP2PView = () => {
    body().innerHTML = `<p class="lead" style="margin-top:0">Ask your friend to create a game and send you their code. Paste it here.</p>
      <textarea class="on-text" id="on-hostcode" rows="4" placeholder="Paste the host's code"></textarea>
      <div class="msg-line" id="on-status"></div>
      <div class="btns"><button class="btn" data-go="home">Back</button><button class="btn primary" data-go="doJoin">Continue</button></div>`;
  };
  const replyView = (code) => {
    body().innerHTML = `<p class="lead" style="margin:0 0 6px">Send this reply code back to the host. Keep this window open.</p>
      <textarea class="on-text" id="on-replycode" readonly rows="4">${esc(code)}</textarea>
      <div class="btns" style="margin-top:6px"><button class="btn small" data-go="copy" data-from="on-replycode">Copy code</button></div>
      <div class="msg-line" id="on-status">Waiting for the host to connect…</div>
      <div class="btns"><button class="btn danger" data-go="cancel">Cancel</button></div>`;
  };
  api = modal({
    dismiss: false,
    html: `<h2>Play online</h2><p class="lead">Play a friend on another device. No account needed.</p><div id="on-body"><div class="msg-line">Checking the connection…</div></div>`,
    onClose: () => { if (!Net.ready) Net.close(); },
    actions: {},
    after: (a) => {
      a.el.addEventListener('click', async (e) => {
        const g = e.target.closest('[data-go]'), v = e.target.closest('[data-v]');
        if (v) {
          const grp = v.parentNode.id; $$('button', v.parentNode).forEach(x => x.classList.toggle('on', x === v));
          if (grp === 'on-len') cfg.matchLen = +v.dataset.v; if (grp === 'on-cube') cfg.cube = v.dataset.v === '1';
          SFX.click(); return;
        }
        if (!g || busy) return;
        const go = g.dataset.go; SFX.click();
        if (go === 'close') { api.close(); return; }
        if (go === 'home' || go === 'cancel') { Net.close(); hostH = null; home(); return; }
        if (go === 'create') { create(); return; }
        if (go === 'join') { mode === 'p2p' ? joinP2PView() : joinRoomView(); return; }
        if (go === 'copy') {
          const el = $('#' + g.dataset.from, api.el), text = el.value !== undefined ? el.value : el.textContent;
          try { await navigator.clipboard.writeText(text); toast('Copied'); } catch (err) { if (el.select) { el.select(); } toast('Select the text and copy it'); }
          return;
        }
        if (go === 'host') {
          cfg.variant = $('#on-var', api.el).value; busy = true;
          try {
            if (mode === 'p2p') {
              status('Preparing your code…');
              hostH = await Net.hostP2P(cfg, profile(), { ready: begin, fail: failCb, bye: () => { } });
              waitingP2P(hostH.code);
            } else {
              waitingRoom(await Net.host(cfg, profile(), { ready: begin, fail: failCb, bye: () => { } }));
            }
          } catch (er) { status(er.message || 'Could not start a game', true); }
          busy = false; return;
        }
        if (go === 'connect') {
          const txt = $('#on-reply', api.el).value.trim(); if (!txt) { status('Paste your friend\'s reply code first.', true); return; }
          busy = true; status('Connecting…');
          try { await hostH.finish(txt); status('Connecting… this takes a few seconds.'); } catch (er) { status(er.message || 'That code did not work.', true); }
          busy = false; return;
        }
        if (go === 'doJoin') {
          busy = true;
          try {
            if (mode === 'p2p') {
              const txt = $('#on-hostcode', api.el).value.trim(); if (!txt) { status('Paste the host\'s code first.', true); busy = false; return; }
              status('Working out your reply…');
              replyView(await Net.joinP2P(txt, profile(), { ready: begin, fail: failCb, bye: () => { } }));
            } else {
              const code = Net.cleanCode($('#on-join', api.el).value); if (code.length !== 4) { status('Enter all four characters.', true); busy = false; return; }
              status('Connecting…');
              await Net.join(code, profile(), { ready: begin, fail: failCb, bye: () => { } });
            }
          } catch (er) { status(er.message || 'Could not connect', true); }
          busy = false; return;
        }
      });
      a.el.addEventListener('input', (e) => { if (e.target.id === 'on-join') e.target.value = Net.cleanCode(e.target.value); if (e.target.id === 'on-name') st.onlineName = e.target.value.slice(0, 14); });
    },
  });
  mode = (await Net.available()) ? 'room' : (Net.p2pSupported() ? 'p2p' : 'none');
  home();
}

/* ---------- boot ---------- */
(function boot() {
  Store.load();
  $('#m-campaign').addEventListener('click', () => { SFX.click(); show('campaign'); });
  $('#m-quick').addEventListener('click', () => { SFX.click(); openSetup('quick'); });
  $('#m-two').addEventListener('click', () => { SFX.click(); openSetup('two'); });
  $('#m-online').addEventListener('click', () => { SFX.click(); openOnline(); });
  $('#m-wild').addEventListener('click', () => { SFX.click(); openSetup('wild'); });
  $('#m-shop').addEventListener('click', () => { SFX.click(); show('shop'); });
  $('#m-stats').addEventListener('click', () => { SFX.click(); show('stats'); });
  $('#m-trophy').addEventListener('click', () => { SFX.click(); show('trophy'); });
  Trophy.wire();
  $('#m-settings').addEventListener('click', () => { SFX.click(); openSettings(); });
  $('#m-howto').addEventListener('click', () => { SFX.click(); openHowTo(); });
  $$('[data-back]').forEach(b => b.addEventListener('click', () => { SFX.click(); show('menu'); }));
  wireSetup(); wireCampaign(); wireShop();
  document.addEventListener('pointerdown', () => SFX.resume(), { once: true });
  $$('[data-fs]').forEach(b => b.addEventListener('click', () => Device.toggleFullscreen()));
  Device.updateFs();
  applySettings();
  show('menu');
  Store.initCloud(() => { applySettings(); refreshCoins(); if (Nav.cur === 'menu') renderMenuProfile(); });
})();

</script>
</body>
</html>
