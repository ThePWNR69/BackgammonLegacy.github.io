<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Backgammon Legacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Direction: a late-night backgammon club. Deep green-black room, brass fittings, cream type.
   Layout idea: full-viewport screens; the board is the hero and everything else frames it. */
:root {
  --bg: #0b110e;
  --bg2: #111b16;
  --panel: #16231d;
  --panel2: #1e3027;
  --line: #2c4238;
  --ink: #f2e9d6;
  --mute: #9aaba1;
  --brass: #d9ac4e;
  --brass2: #f1cf86;
  --ember: #e4693f;
  --good: #5bdc92;
  --bad: #ff6f5e;
  --blue: #62adff;
  --violet: #b784ff;
  --font-d: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-b: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: manipulation; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 15px; line-height: 1.4;
  overflow: hidden; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--font-d); margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--brass2); outline-offset: 2px; }
#app { position: fixed; inset: 0; background:
  radial-gradient(1200px 700px at 20% -10%, rgba(217,172,78,0.10), transparent 60%),
  radial-gradient(900px 600px at 100% 110%, rgba(40,120,80,0.16), transparent 60%), var(--bg); }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }
.scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel2); font-weight: 700; letter-spacing: 0.01em; transition: transform .08s, background .15s, border-color .15s, opacity .15s;
}
.btn:hover:not(:disabled) { border-color: var(--brass); background: #24392f; }
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #f1cf86, #cf9f3d); color: #1d1405; border-color: #f7dc9c; box-shadow: 0 6px 20px -8px rgba(217,172,78,0.7); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #f8dc9c, #d9ac4e); }
.btn.danger { border-color: #7a3a33; color: #ffb4aa; }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn.big { padding: 14px 26px; font-size: 17px; border-radius: 12px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.icon-btn:hover { border-color: var(--brass); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pulse { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(241,207,134,0.55), 0 6px 20px -8px rgba(217,172,78,0.7); } 50% { box-shadow: 0 0 0 9px rgba(241,207,134,0), 0 6px 20px -8px rgba(217,172,78,0.7); } }

/* ---------- common widgets ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--mute); white-space: nowrap; }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip i { font-style: normal; font-size: 10px; letter-spacing: .12em; }
.coin { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--brass2); font-variant-numeric: tabular-nums; }
.coin::before { content: ''; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b8, #e0a92f 55%, #8d6410); box-shadow: inset 0 0 0 2px rgba(120,80,0,0.45); }
.xpbar { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
.xpbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6fd3a0, #d9ac4e); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.07); color: var(--mute); }
.back-row { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: rgba(8,13,11,0.6); backdrop-filter: blur(6px); }
.back-row h2 { font-size: 24px; flex: 1; font-weight: 700; }
.pad { padding: 22px; }

/* ---------- menu ---------- */
#screen-menu { flex-direction: row; align-items: stretch; }
.menu-left { flex: 0 0 min(520px, 46%); min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; padding: 28px 40px; gap: 22px; position: relative; z-index: 1; overflow-y: auto; overflow-x: hidden; container-type: inline-size; }
.wordmark { font-size: clamp(34px, 13cqi, 84px); line-height: 0.95; overflow-wrap: anywhere; font-weight: 800; letter-spacing: -0.02em; font-variation-settings: 'SOFT' 100, 'WONK' 1; }
.wordmark span { display: block; font-style: italic; font-weight: 500; color: var(--brass2); font-size: 0.52em; letter-spacing: 0.04em; margin-top: 6px; }
.menu-profile { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(22,35,29,0.8); }
.lvl-badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-d); font-weight: 800; font-size: 22px; color: #1d1405; background: radial-gradient(circle at 30% 25%, #fff0b8, #d9ac4e 60%, #8d6410); box-shadow: 0 0 0 3px rgba(217,172,78,0.25); flex: none; }
.menu-profile .mid { flex: 1; min-width: 0; }
.menu-profile .rank { font-weight: 800; }
.menu-profile .sub { color: var(--mute); font-size: 12px; margin-bottom: 5px; }
.menu-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu-btn.hero { grid-column: 1 / -1; }
.menu-btn:not(.hero) small { display: none; }
.menu-btn:not(.hero) { padding: 12px 14px; gap: 11px; }
.menu-btn:not(.hero) b { font-size: 19px; }
.menu-btn:not(.hero) .ico { width: 34px; height: 34px; }
.menu-btn { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); transition: transform .12s, border-color .15s, background .15s; }
.menu-btn:hover { transform: translateX(4px); border-color: var(--brass); background: var(--panel2); }
.menu-btn.hero { background: linear-gradient(135deg, #e7c26f, #b9852a); color: #1d1405; border-color: #f4d78f; }
.menu-btn.hero small { color: rgba(29,20,5,0.75); }
.menu-btn b { font-family: var(--font-d); font-size: 22px; font-weight: 700; display: block; }
.menu-btn small { color: var(--mute); font-size: 13px; }
.menu-btn .ico { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,0.07); }
.menu-btn.hero .ico { background: rgba(255,255,255,0.28); }
.menu-btn .ico svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.menu-row { display: flex; gap: 10px; }
.menu-row .btn { flex: 1; }
.menu-right { flex: 1; min-width: 0; display: grid; place-items: center; padding: 28px 28px 28px 0; position: relative; }
.menu-right canvas { filter: drop-shadow(0 30px 40px rgba(0,0,0,0.65)); border-radius: 12px; }
@media (max-width: 980px) {
  #screen-menu { flex-direction: column; overflow-y: auto; }
  .menu-left { flex: none; padding: 20px 18px 10px; overflow: visible; }
  .menu-right { padding: 10px 14px 22px; order: -1; flex: none; }
  .wordmark span { font-size: 0.5em; }
}
/* landscape phones: keep the two-column menu and make everything fit without scrolling */
@media (max-height: 520px) and (orientation: landscape) {
  #screen-menu { flex-direction: row; overflow: hidden; }
  .menu-left { flex: 0 0 56%; padding: 10px 14px 10px max(16px, env(safe-area-inset-left)); gap: 8px; overflow-y: auto; justify-content: center; }
  .menu-right { flex: 1; order: 0; padding: 10px max(14px, env(safe-area-inset-right)) 10px 0; }
  .menu-right canvas { max-width: 100%; max-height: 100%; }
  .wordmark { font-size: 34px !important; line-height: 0.95; margin: 0; }
  .wordmark span { font-size: 0.55em; display: inline; margin-left: 8px; }
  .menu-profile { padding: 6px 10px; gap: 10px; }
  .menu-btns { grid-template-columns: 1fr 1fr; gap: 7px; }
  .menu-btn { padding: 8px 10px; gap: 9px; }
  .menu-btn b { font-size: 16px; }
  .menu-btn small { display: none; }
  .menu-btn .ico { width: 30px; height: 30px; }
  .menu-btn .ico svg { width: 18px; height: 18px; }
  .menu-btn.hero { grid-column: 1 / -1; }
  .menu-row { gap: 7px; }
  .fs-btn { top: 8px; }
}

/* ---------- setup ---------- */
.setup-grid { display: grid; gap: 22px; max-width: 880px; margin: 0 auto; width: 100%; }
.field > label, .field > .lbl { display: block; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; text-align: left; }
.seg button small { display: block; font-weight: 500; color: var(--mute); font-size: 12px; }
.seg button.on { border-color: var(--brass); background: rgba(217,172,78,0.14); box-shadow: inset 0 0 0 1px var(--brass); }
.seg button:hover { border-color: var(--brass); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: pointer; }
.toggle .sw { width: 42px; height: 24px; border-radius: 99px; background: #2a3a33; position: relative; flex: none; transition: background .15s; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #cfd8d2; transition: transform .15s; }
.toggle.on .sw { background: var(--brass); }
.toggle.on .sw::after { transform: translateX(18px); background: #fff; }
.toggle b { display: block; font-weight: 700; }
.toggle small { color: var(--mute); }
.reward-note { padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--mute); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- campaign ---------- */
.chapter { margin: 0 auto 30px; max-width: 1100px; width: 100%; }
.chapter-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--cc, var(--brass)); flex-wrap: wrap; }
.chapter-head h3 { font-size: 26px; }
.chapter-head p { margin: 0; color: var(--mute); flex: 1; min-width: 200px; }
.chapter-head .num { font-family: var(--font-d); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--cc); font-weight: 800; }
.stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.stage { position: relative; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 6px; transition: transform .12s, border-color .15s; min-height: 150px; }
.stage:hover:not(.locked) { transform: translateY(-3px); border-color: var(--cc); }
.stage.locked { opacity: 0.45; cursor: not-allowed; }
.stage.next { border-color: var(--cc); box-shadow: 0 0 0 1px var(--cc), 0 10px 30px -12px var(--cc); }
.stage .top { display: flex; align-items: center; gap: 10px; }
.stage .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; background: var(--cc); color: #101510; flex: none; }
.stage .av { font-size: 30px; line-height: 1; }
.stage b { font-family: var(--font-d); font-size: 17px; line-height: 1.15; }
.stage .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 18px; height: 18px; }
svg.off { fill: rgba(255,255,255,0.12); }
svg.on { fill: var(--brass2); filter: drop-shadow(0 0 4px rgba(241,207,134,0.5)); }
.boss-tag { position: absolute; top: 10px; right: 10px; font-size: 10px; letter-spacing: .14em; font-weight: 800; color: #1d0e08; background: linear-gradient(180deg, #ffb27a, #e4693f); padding: 2px 7px; border-radius: 5px; }
.lock-ico { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; opacity: .8; }

/* ---------- shop ---------- */
.shop-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; padding: 10px 22px 0; overflow-x: auto; border-bottom: 1px solid var(--line); background: rgba(8,13,11,0.5); flex: none; }
.tab { padding: 10px 16px; border: 1px solid transparent; border-bottom: none; border-radius: 10px 10px 0 0; background: transparent; font-weight: 700; color: var(--mute); white-space: nowrap; }
.tab.on { background: var(--panel); border-color: var(--line); color: var(--ink); box-shadow: inset 0 2px 0 var(--brass); }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; padding: 22px; max-width: 1300px; margin: 0 auto; width: 100%; }
.item { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow: hidden; display: flex; flex-direction: column; }
.item.equipped { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.item .thumb { height: 128px; background: radial-gradient(circle at 50% 40%, #223a2f, #0f1a15); display: grid; place-items: center; position: relative; }
.item .thumb canvas { max-width: 100%; max-height: 100%; }
.item .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.item h4 { font-size: 18px; }
.item p { margin: 0; color: var(--mute); font-size: 13px; flex: 1; }
.item .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.item .row .btn { flex: 1; }
.rar { font-size: 10px; letter-spacing: .12em; font-weight: 800; text-transform: uppercase; }
.owned-mark { position: absolute; top: 8px; right: 8px; }

/* ---------- game ---------- */
#screen-game { background: radial-gradient(1100px 700px at 50% 40%, rgba(30,70,50,0.35), transparent 70%); }
.hud { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: rgba(8,13,11,0.7); backdrop-filter: blur(6px); flex: none; z-index: 2; }
.hud.top { border-bottom: 1px solid var(--line); }
.hud.bottom { border-top: 1px solid var(--line); }
.pl { display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 6px; border-radius: 12px; border: 1px solid transparent; transition: border-color .2s, background .2s, box-shadow .2s; min-width: 0; }
.pl.active { border-color: var(--brass); background: rgba(217,172,78,0.10); box-shadow: 0 0 18px -6px var(--brass); }
.pl .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--panel2); border: 2px solid var(--line); flex: none; }
.pl.active .av { border-color: var(--brass2); }
.pl-info { min-width: 0; }
.pl-info b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
.pl-info .sub { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 170px; }
.pl .stats { display: flex; gap: 6px; }
.match-box { flex: 1; text-align: center; min-width: 0; }
.match-box .score { font-family: var(--font-d); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.match-box .score { display: flex; justify-content: center; align-items: flex-end; gap: 14px; line-height: 1; }
.match-box .score .sc { text-align: center; min-width: 44px; }
.match-box .score .sc small { display: block; font-family: var(--font-b); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 700; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
.match-box .score .sep { opacity: .5; padding-bottom: 2px; }
.match-box .info { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 6px; }
#board { touch-action: none; border-radius: 10px; box-shadow: 0 24px 60px -10px rgba(0,0,0,0.7); cursor: default; }
/* 3D board: a WebGL canvas sits under the transparent overlay canvas that takes input */
.gl-stack { position: relative; display: inline-block; line-height: 0; }
.gl-stack > .gl-canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.gl-stack > canvas:not(.gl-canvas) { position: relative; }
canvas.gl { box-shadow: none !important; border-radius: 0 !important; }
#board-toast { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; }
.banner { font-family: var(--font-d); font-weight: 800; font-size: clamp(26px, 5vw, 56px); color: var(--brass2); text-shadow: 0 4px 24px rgba(0,0,0,0.8), 0 0 30px rgba(217,172,78,0.5); animation: banner 1.6s ease forwards; letter-spacing: .02em; text-align: center; padding: 0 16px; }
@keyframes banner { 0% { opacity: 0; transform: scale(0.8); } 15% { opacity: 1; transform: scale(1.04); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
.msg { flex: 1; min-width: 0; text-align: center; font-weight: 600; color: var(--ink); min-height: 22px; }
.msg small { color: var(--mute); font-weight: 500; }
.actions { display: flex; gap: 8px; align-items: center; }
#game-bottom-left { display: flex; align-items: center; }
@media (max-width: 720px) {
  .hud { padding: 6px 8px; gap: 6px; flex-wrap: wrap; }
  .pl .stats { display: none; }
  .pl-info b, .pl-info .sub { max-width: 110px; }
  .match-box .score { font-size: 19px; }
  .hud.bottom { justify-content: space-between; }
  .hud.bottom .msg { order: -1; flex-basis: 100%; }
  .btn { padding: 9px 12px; }
}

/* ---------- modals ---------- */
#modal-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.modal-bg { position: absolute; inset: 0; background: rgba(4,8,6,0.72); backdrop-filter: blur(5px); display: grid; place-items: center; pointer-events: auto; padding: 16px; animation: fade .18s ease; overflow-y: auto; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(180deg, #1b2c24, #121e19); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8); animation: pop .22s cubic-bezier(.2,.9,.3,1.2); }
.modal.wide { width: min(760px, 100%); }
@keyframes pop { from { transform: translateY(14px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h2 { font-size: 30px; margin-bottom: 4px; }
.modal .lead { color: var(--mute); margin: 0 0 16px; }
.modal .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; justify-content: flex-end; }
.modal .btns .btn { flex: 1 1 130px; }
.rw-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
.rw-table td { padding: 6px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.rw-table td:not(:first-child) { text-align: right; width: 90px; }
.rw-table tr.total td { border-bottom: none; font-weight: 800; font-size: 18px; color: var(--brass2); padding-top: 10px; }
.obj { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,0.04); margin-bottom: 6px; }
.obj.done { background: rgba(91,220,146,0.10); }
.obj svg { width: 22px; height: 22px; flex: none; }
.big-av { font-size: 64px; line-height: 1; text-align: center; }
.levelup { text-align: center; padding: 12px; margin: 10px 0; border-radius: 14px; background: radial-gradient(circle at 50% 0%, rgba(241,207,134,0.25), rgba(241,207,134,0.05)); border: 1px solid var(--brass); animation: pop .5s ease; }
.levelup b { font-family: var(--font-d); font-size: 24px; color: var(--brass2); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.slider { width: 100%; accent-color: var(--brass); }
.preview-stage { background: radial-gradient(circle at 50% 40%, #1c3329, #0a120e); border-radius: 12px; overflow: hidden; display: grid; place-items: center; margin: 10px 0; }
.howto h4 { margin: 14px 0 4px; color: var(--brass2); font-size: 18px; }
.howto p, .howto li { color: #d6d1c0; margin: 0 0 6px; }
.howto ul { padding-left: 20px; margin: 0; }

/* ---------- stats ---------- */
:root { --you: #3987e5; --opp: #d95926; }
.st-tabs { display: flex; gap: 6px; margin: 4px 0 14px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
.st-tabs button { flex: 1; padding: 8px 10px; border-radius: 9px; font-weight: 700; color: var(--mute); background: transparent; border: 0; }
.st-tabs button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--brass); }
.st-pane[hidden] { display: none; }
.st-legend { display: flex; gap: 16px; font-size: 13px; color: var(--mute); margin-bottom: 8px; }

.vs-row { display: grid; grid-template-columns: minmax(104px, 34%) 1fr; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(44,66,56,0.55); }

.vs-line b { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1; }
.st-note { margin-top: 10px; font-size: 13px; color: var(--mute); }

.st-games { font-size: 13px; }
.st-games td { padding: 6px 4px; }

.st-games small, .st-rec small { color: var(--mute); font-weight: 500; }
.spark { position: relative; height: 74px; margin: 4px 0 2px; }
.spark svg { width: 100%; height: 100%; display: block; }
.spark span { position: absolute; right: 2px; font-size: 10px; color: var(--mute); font-variant-numeric: tabular-nums; }
.spark .sp-top { top: -2px; } .spark .sp-bot { bottom: -2px; } .spark .sp-end { display: none; }
.st-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.st-tile { padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px; }
.st-tile b { font-family: var(--font-d); font-size: 30px; line-height: 1.1; color: var(--brass2); font-variant-numeric: tabular-nums; }
.st-tile span { font-size: 13px; font-weight: 600; }
.st-tile small { color: var(--mute); font-size: 12px; }
.st-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.st-card { padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
.st-card.wide { margin-top: 14px; }
.st-card h3 { font-family: var(--font-d); font-size: 20px; margin: 0 0 10px; }
.st-skill { display: flex; gap: 16px; align-items: center; }
.st-skill-r { flex: 1; min-width: 0; }
.ring { width: 96px; height: 96px; flex: none; }
.ring-t { font-family: var(--font-d); font-size: 24px; font-weight: 700; fill: var(--ink); }

.hist-head, .hist-row { display: grid; grid-template-columns: 34px 1fr 56px 74px; gap: 10px; align-items: center; }

@media (max-width: 520px) { .st-grid { grid-template-columns: 1fr; } .vs-row { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- wild mode ---------- */

.perkbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px max(14px, env(safe-area-inset-left)); background: rgba(8,13,11,0.55); border-top: 1px solid var(--line); }

.perk:not(:disabled):hover { background: rgba(217,172,78,0.28); }
.perk-opp { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1px dashed var(--line); background: rgba(255,255,255,0.04); font-weight: 800; color: var(--mute); font-size: 14px; }
.perk-opp.spent { opacity: .45; border-style: solid; }
.perk-side.opp small { color: var(--mute); font-size: 12px; margin-right: 2px; }
.perk-note { flex: 1; text-align: center; color: var(--brass2); font-size: 13px; font-weight: 700; }
body.compact .perkbar { padding-top: 2px; padding-bottom: 2px; }
body.compact .perk { padding: 2px 9px; min-height: 30px; }

@media (max-width: 520px) { .perk .pk-name { display: none; } .perk { padding: 6px 12px; } .perk-side.opp small { display: none; } }

/* ---------- chapter scenes ---------- */
.scene { width: 100%; height: 100%; display: block; }
.scene .sc-sway { animation: sc-sway 5s ease-in-out infinite; }
.scene .sc-steam path { animation: sc-steam 2.6s ease-in-out infinite; opacity: 0; transform-box: fill-box; }
.scene .sc-rain { animation: sc-rain .9s linear infinite; }
.scene .sc-twinkle { animation: sc-twinkle 2.6s ease-in-out infinite; }
.scene .sc-drift { animation: sc-drift 12s linear infinite; }
.scene .sc-bob { animation: sc-bob 4s ease-in-out infinite; }
.scene .sc-beam { animation: sc-beam 9s ease-in-out infinite alternate; }
.scene .sc-gull { animation: sc-gull 26s linear infinite; }
.scene .sc-flicker { animation: sc-flicker 4.5s linear infinite; }
.scene .sc-sweep { animation: sc-sweep 7s ease-in-out infinite alternate; }
.scene .sc-spin { animation: sc-spin 20s linear infinite; transform-box: fill-box; transform-origin: center; }
.scene .sc-flag { animation: sc-flag 3.2s ease-in-out infinite alternate; }
.scene .sc-bobs { animation: sc-bobs 1.5s ease-in-out infinite alternate; }
.scene .sc-candle { animation: sc-candle .9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
.scene .sc-dust { animation: sc-dust 7s linear infinite; opacity: 0; }
@keyframes sc-sway { 0%,100% { transform: rotate(-2.500deg); } 50% { transform: rotate(2.500deg); } }
@keyframes sc-steam { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: .85; } 100% { transform: translateY(-14px); opacity: 0; } }
@keyframes sc-rain { from { transform: translateY(-20px); } to { transform: translateY(100px); } }
@keyframes sc-twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
@keyframes sc-drift { from { transform: translateX(0); } to { transform: translateX(-200px); } }
@keyframes sc-bob { 0%,100% { transform: translateY(-3px) rotate(-1.500deg); } 50% { transform: translateY(4px) rotate(1.500deg); } }
@keyframes sc-beam { from { transform: rotate(-16deg); } to { transform: rotate(14deg); } }
@keyframes sc-gull { from { transform: translateX(-120px); } to { transform: translateX(980px); } }
@keyframes sc-flicker { 0%,100% { opacity: 1; } 6% { opacity: .5; } 8% { opacity: 1; } 52% { opacity: 1; } 54% { opacity: .35; } 57% { opacity: 1; } }
@keyframes sc-sweep { from { transform: rotate(-13deg); } to { transform: rotate(13deg); } }
@keyframes sc-spin { to { transform: rotate(360deg); } }
@keyframes sc-flag { from { transform: skewX(-3deg); } to { transform: skewX(3deg); } }
@keyframes sc-bobs { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes sc-candle { from { transform: scale(1, .85); opacity: .8; } to { transform: scale(1.100, 1.100); opacity: 1; } }
@keyframes sc-dust { 0% { transform: translateY(20px); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-50px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } .scene .sc-steam path { opacity: .5; } .scene .sc-dust { opacity: .6; } }

/* ---------- campaign map ---------- */
#campaign-body { padding: 0 0 40px; position: relative; }
.cm-bar { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px max(16px, env(safe-area-inset-left)); background: rgba(8,13,11,0.88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.cm-jump { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; max-width: 100%; }
.cm-jump button { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.cm-jump button i { width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }

.cm-chapter { position: relative; scroll-margin-top: 112px; max-width: 1040px; margin: 0 auto 36px; padding: 0 max(12px, env(safe-area-inset-left)); }
.cm-banner { position: relative; width: 100%; aspect-ratio: 800 / 300; min-height: 168px; max-height: 300px; margin-top: 16px; overflow: hidden; border-radius: 18px; border: 1px solid color-mix(in srgb, var(--cc) 55%, #000); box-shadow: 0 18px 40px -22px rgba(0,0,0,0.85), inset 0 -3px 0 var(--cc); }

.cm-title { position: absolute; left: 22px; bottom: 16px; max-width: min(520px, 70%); }
.cm-title .num { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800; color: var(--cc); filter: brightness(1.25); }
.cm-title h3 { font-family: var(--font-d); font-size: clamp(26px, 4.2vw, 40px); line-height: 1.05; margin: 2px 0 4px; text-shadow: 0 2px 14px rgba(0,0,0,0.6); }
.cm-title p { margin: 0; color: #d6ddd7; font-size: 14px; text-shadow: 0 1px 8px rgba(0,0,0,0.7); }
.cm-meta { position: absolute; right: 14px; top: 12px; display: flex; gap: 6px; }
.cm-meta .chip.ok { color: var(--good); border-color: var(--good); }
.cm-chapter.locked .cm-banner .scene { filter: grayscale(.85) brightness(.6); }
.cm-path { position: relative; max-width: 820px; margin: 0 auto; background: radial-gradient(ellipse 70% 38% at 50% 0%, color-mix(in srgb, var(--cc) 9%, transparent), transparent 70%); }
.cm-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.cm-line path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.cm-line .todo { stroke: rgba(255,255,255,0.18); stroke-width: 4; stroke-dasharray: 2 12; }
.cm-line .done { stroke: var(--cc); stroke-width: 5; opacity: .9; filter: drop-shadow(0 0 6px var(--cc)); }
.cm-node { position: absolute; transform: translate(-50%, -34px); display: flex; flex-direction: column; align-items: center; width: 168px; padding: 0; background: none; border: 0; text-align: center; color: var(--ink); }
.cm-ring { position: relative; width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--cc); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--cc) 55%, #1a2a22), #0e1814 80%); box-shadow: 0 8px 20px -6px rgba(0,0,0,0.7); transition: transform .15s; }
.cm-face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: block; }

.cm-node.boss { transform: translate(-50%, -44px); }

.cm-num { position: absolute; right: -4px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; background: var(--cc); color: #101510; border: 2px solid #0e1814; }
.cm-cap { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-top: 7px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
.cm-cap b { font-family: var(--font-d); font-size: 16px; line-height: 1.1; }

.cm-stars { display: flex; gap: 1px; margin-top: 2px; }
.cm-gift { margin-top: 3px; padding: 1px 8px; border-radius: 999px; background: rgba(255,157,61,0.16); border: 1px solid rgba(255,157,61,0.5); color: #ffb86b; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-shadow: none; }
.cm-node.locked { cursor: not-allowed; }

.cm-node.locked .cm-cap { opacity: .65; }
.cm-node.next .cm-ring { animation: cm-pulse 1.8s ease-in-out infinite; }
.cm-node.done .cm-ring { box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc) 45%, transparent), 0 8px 20px -6px rgba(0,0,0,0.7); }
@keyframes cm-pulse { 0%,100% { box-shadow: 0 0 0 0 var(--cc), 0 8px 20px -6px rgba(0,0,0,0.7); } 50% { box-shadow: 0 0 0 10px transparent, 0 8px 20px -6px rgba(0,0,0,0.7); } }
@media (prefers-reduced-motion: reduce) { .cm-node.next .cm-ring { animation: none; } }
@media (max-width: 520px) { .cm-node { width: 132px; } .cm-jump { margin-left: 0; width: 100%; } }

/* ---------- in-match backdrop and portrait avatars ---------- */

.pl .av { overflow: hidden; padding: 0; }

/* ---------- trophy room ---------- */

.tr-const svg line { stroke: rgba(255,255,255,0.12); stroke-width: .5; }

.tr-stage { position: relative; flex: 1; min-height: 160px; }
#trophy-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
.tr-picks { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 10px; pointer-events: none; }

.tr-face { width: 74px; height: 74px; border-radius: 50%; overflow: hidden; border: 2px solid var(--brass); background: radial-gradient(circle at 50% 30%, #2c4a3b, #0e1814); flex: none; position: relative; }
.tr-face .portrait { position: absolute; left: -8%; bottom: -4%; width: 116%; height: 116%; }

.tr-info h3 { font-family: var(--font-d); font-size: 22px; margin: 2px 0; }
.tr-info p { margin: 0 0 6px; color: var(--mute); font-size: 13px; }
.tr-info .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tr-act { flex: none; }
@media (max-width: 700px) { .tr-panel { flex-wrap: wrap; } .tr-act { width: 100%; } .tr-act .btn { width: 100%; } .tr-const b { font-size: 9px; } .tr-const small { display: none; } .tr-face { width: 56px; height: 56px; } .tr-info h3 { font-size: 18px; } }

<script>
/* ============================================================
   Backgammon rules engine
   Position: pts[0..23] signed counts (+ = player 0, - = player 1)
   Player 0 moves 23 -> 0 (home 0..5), player 1 moves 0 -> 23 (home 18..23)
   ============================================================ */
const BG = (() => {
  const BAR = 25, OFF = 26;

  const emptyPos = () => ({ pts: new Array(24).fill(0), bar: [0, 0], off: [0, 0] });
  // shield[p] (Wild mode, Safe Harbor): while set, player p's lone checkers cannot be hit. The array is replaced, never mutated.
  const clone = (p) => ({ pts: p.pts.slice(), bar: p.bar.slice(), off: p.off.slice(), shield: p.shield });

  // spec: { pointNumber(own perspective): count, bar: n }
  function placeSide(pos, p, spec) {
    for (const k in spec) {
      if (k === 'bar') { pos.bar[p] += spec[k]; continue; }
      const n = +k;
      const i = p === 0 ? n - 1 : 24 - n;
      pos.pts[i] += (p === 0 ? 1 : -1) * spec[k];
    }
  }

  function randomSpec(rng, lo, hi, weights) {
    const spec = {};
    const pts = [];
    for (let n = lo; n <= hi; n++) pts.push(n);
    for (let c = 0; c < 15; c++) {
      let tot = 0; const w = pts.map(n => { const v = weights ? weights(n) : 1; tot += v; return v; });
      let r = rng() * tot, idx = 0;
      for (; idx < pts.length; idx++) { r -= w[idx]; if (r <= 0) break; }
      const n = pts[Math.min(idx, pts.length - 1)];
      spec[n] = (spec[n] || 0) + 1;
    }
    return spec;
  }

  const VARIANTS = {
    classic: { name: 'Classic', tag: 'Standard opening position', build: () => ({ s: { 24: 2, 13: 5, 8: 3, 6: 5 } }) },
    nack: { name: 'Nackgammon', tag: 'Two extra checkers start on the 23-point', build: () => ({ s: { 24: 2, 23: 2, 13: 4, 8: 3, 6: 4 } }) },
    hyper: { name: 'Hypergammon', tag: 'Three checkers each, fast and sharp', build: () => ({ s: { 24: 1, 23: 1, 22: 1 }, total: 3 }) },
    blitz: { name: 'Blitzkrieg', tag: 'Both sides begin with two checkers on the bar', build: () => ({ s: { bar: 2, 13: 5, 8: 3, 6: 5 } }) },
    prime: { name: 'Prime Time', tag: 'Both sides start with a five-point prime', build: () => ({ s: { 24: 2, 13: 3, 8: 2, 7: 2, 6: 2, 5: 2, 4: 2 } }) },
    race: { name: 'Sprint', tag: 'No contact, a pure race home', build: (rng) => ({ s: randomSpec(rng, 6, 12, n => 1 + (n - 6) * 0.4) }) },
    bearoff: { name: 'Home Stretch', tag: 'Everyone starts in the home board', build: (rng) => ({ s: randomSpec(rng, 1, 6, n => 1 + n * 0.3) }) },
  };

  function startPos(variantId, rng) {
    const v = VARIANTS[variantId] || VARIANTS.classic;
    const b = v.build(rng || Math.random);
    const pos = emptyPos();
    placeSide(pos, 0, b.s);
    placeSide(pos, 1, b.s);
    pos.total = b.total || 15;
    return pos;
  }

  const total = (pos) => pos.total || 15;
  const cnt = (pos, p, i) => { const v = pos.pts[i]; return p === 0 ? (v > 0 ? v : 0) : (v < 0 ? -v : 0); };

  function allHome(pos, p) {
    if (pos.bar[p] > 0) return false;
    if (p === 0) { for (let i = 6; i < 24; i++) if (pos.pts[i] > 0) return false; }
    else { for (let i = 0; i < 18; i++) if (pos.pts[i] < 0) return false; }
    return true;
  }

  function movesFor(pos, p, d) {
    const out = [];
    const opp = 1 - p, sh = !!(pos.shield && pos.shield[opp]);
    if (pos.bar[p] > 0) {
      const to = p === 0 ? 24 - d : d - 1;
      const oc = cnt(pos, opp, to);
      if (oc < 2 && !(oc === 1 && sh)) out.push({ from: BAR, to, die: d, hit: oc === 1 });
      return out;
    }
    const bo = allHome(pos, p);
    let maxDist = 0;
    if (bo) {
      if (p === 0) { for (let i = 5; i >= 0; i--) if (pos.pts[i] > 0) { maxDist = i + 1; break; } }
      else { for (let i = 18; i < 24; i++) if (pos.pts[i] < 0) { maxDist = 24 - i; break; } }
    }
    for (let i = 0; i < 24; i++) {
      if (cnt(pos, p, i) === 0) continue;
      const to = p === 0 ? i - d : i + d;
      if (to < 0 || to > 23) {
        if (!bo) continue;
        const dist = p === 0 ? i + 1 : 24 - i;
        if (d === dist || (d > dist && dist === maxDist)) out.push({ from: i, to: OFF, die: d, hit: false });
      } else {
        const oc = cnt(pos, opp, to);
        if (oc < 2 && !(oc === 1 && sh)) out.push({ from: i, to, die: d, hit: oc === 1 });
      }
    }
    return out;
  }

  function applyMove(pos, p, m) {
    const n = clone(pos);
    n.total = pos.total;
    const s = p === 0 ? 1 : -1;
    if (m.from === BAR) n.bar[p]--; else n.pts[m.from] -= s;
    if (m.to === OFF) n.off[p]++;
    else {
      if (m.hit) { n.pts[m.to] = 0; n.bar[1 - p]++; }
      n.pts[m.to] += s;
    }
    return n;
  }

  function key(pos) {
    let s = '';
    for (let i = 0; i < 24; i++) s += String.fromCharCode(pos.pts[i] + 20);
    return s + String.fromCharCode(pos.bar[0] + 20, pos.bar[1] + 20, pos.off[0] + 20, pos.off[1] + 20);
  }

  const diceToList = (d1, d2) => (d1 === d2 ? [d1, d1, d1, d1] : [d1, d2]);

  // All unique legal full turns. Returns [{moves, pos}] (max-dice rule + higher-die rule enforced)
  function genTurns(pos, p, dice) {
    const results = new Map();
    let best = 0;
    const seen = new Set();
    const rec = (cur, rem, moves) => {
      const k = key(cur) + '|' + rem.join('');
      if (seen.has(k)) return;
      seen.add(k);
      let any = false;
      const tried = new Set();
      for (let idx = 0; idx < rem.length; idx++) {
        const d = rem[idx];
        if (tried.has(d)) continue;
        tried.add(d);
        const ms = movesFor(cur, p, d);
        if (!ms.length) continue;
        any = true;
        const r2 = rem.filter((_, j) => j !== idx);
        for (const m of ms) rec(applyMove(cur, p, m), r2, moves.concat([m]));
      }
      if (!any) {
        const len = moves.length;
        if (len > best) { best = len; results.clear(); }
        if (len === best) results.set(key(cur), { moves, pos: cur });
      }
    };
    rec(pos, dice, []);
    let list = [...results.values()];
    if (best === 1 && dice.length === 2 && dice[0] !== dice[1]) {
      const hi = Math.max(dice[0], dice[1]);
      const hiList = list.filter(r => r.moves[0].die === hi);
      if (hiList.length) list = hiList;
    }
    return list;
  }

  function maxPlay(pos, p, rem, memo) {
    if (!rem.length) return 0;
    const k = key(pos) + '|' + rem.join('');
    const c = memo.get(k);
    if (c !== undefined) return c;
    let best = 0;
    const tried = new Set();
    for (let idx = 0; idx < rem.length && best < rem.length; idx++) {
      const d = rem[idx];
      if (tried.has(d)) continue;
      tried.add(d);
      const ms = movesFor(pos, p, d);
      if (!ms.length) continue;
      const r2 = rem.filter((_, j) => j !== idx);
      for (const m of ms) {
        const v = 1 + maxPlay(applyMove(pos, p, m), p, r2, memo);
        if (v > best) best = v;
        if (best === rem.length) break;
      }
    }
    memo.set(k, best);
    return best;
  }

  // Legal next single moves given the dice still to play (UI helper).
  function legalNext(pos, p, rem) {
    if (!rem.length) return [];
    const memo = new Map();
    const totalPlay = maxPlay(pos, p, rem, memo);
    if (totalPlay === 0) return [];
    let res = [];
    const tried = new Set();
    for (let idx = 0; idx < rem.length; idx++) {
      const d = rem[idx];
      if (tried.has(d)) continue;
      tried.add(d);
      const r2 = rem.filter((_, j) => j !== idx);
      for (const m of movesFor(pos, p, d)) {
        if (1 + maxPlay(applyMove(pos, p, m), p, r2, memo) === totalPlay) res.push(m);
      }
    }
    if (rem.length === 2 && rem[0] !== rem[1] && totalPlay === 1) {
      const hi = Math.max(rem[0], rem[1]);
      const h = res.filter(m => m.die === hi);
      if (h.length) res = h;
    }
    return res;
  }

  const winnerOf = (pos) => (pos.off[0] >= total(pos) ? 0 : pos.off[1] >= total(pos) ? 1 : -1);

  // 1 = single, 2 = gammon, 3 = backgammon
  function gameValue(pos, w) {
    const l = 1 - w;
    if (pos.off[l] > 0) return 1;
    let bg = pos.bar[l] > 0;
    if (!bg) {
      if (w === 0) { for (let i = 0; i < 6; i++) if (pos.pts[i] < 0) bg = true; }
      else { for (let i = 18; i < 24; i++) if (pos.pts[i] > 0) bg = true; }
    }
    return bg ? 3 : 2;
  }

  function pips(pos, p) {
    let s = pos.bar[p] * 25;
    for (let i = 0; i < 24; i++) {
      const c = cnt(pos, p, i);
      if (c) s += c * (p === 0 ? i + 1 : 24 - i);
    }
    return s;
  }

  const onBoard = (pos, p) => { let s = pos.bar[p]; for (let i = 0; i < 24; i++) s += cnt(pos, p, i); return s; };

  function inContact(pos) {
    // player 0 checker at index i is in contact with a player 1 checker at index j if i > j (or bars)
    let max0 = pos.bar[0] > 0 ? 99 : -1, min1 = pos.bar[1] > 0 ? -99 : 99;
    for (let i = 0; i < 24; i++) {
      if (pos.pts[i] > 0 && i > max0) max0 = i;
      if (pos.pts[i] < 0 && i < min1) min1 = i;
    }
    return max0 > min1;
  }

  const rollDie = () => {
    try {
      const a = new Uint32Array(1);
      let x;
      do { crypto.getRandomValues(a); x = a[0]; } while (x >= 4294967292);
      return (x % 6) + 1;
    } catch (e) { return 1 + Math.floor(Math.random() * 6); }
  };

  return {
    BAR, OFF, VARIANTS, emptyPos, clone, startPos, cnt, allHome, movesFor, applyMove, key, diceToList,
    genTurns, maxPlay, legalNext, winnerOf, gameValue, pips, onBoard, inContact, rollDie, total,
  };
})();

/* ============================================================
   Backgammon AI: heuristic evaluation, difficulty levels, play styles, cube sense
   Evaluation is in "pip equivalents" from the point of view of the side being scored.
   ============================================================ */
const AI = (() => {
  // View from player p. a[n]: my checkers on my n-point (n=1..24, 25 = bar). b[n]: opponent checkers on that same
  // physical point expressed in my numbering (their bar = 0).
  function view(pos, p) {
    const a = new Int8Array(26), b = new Int8Array(26);
    for (let i = 0; i < 24; i++) {
      const v = pos.pts[i];
      if (!v) continue;
      const n = p === 0 ? i + 1 : 24 - i;
      if ((p === 0) === (v > 0)) a[n] = v < 0 ? -v : v; else b[n] = v < 0 ? -v : v;
    }
    return { a, b, aBar: pos.bar[p], bBar: pos.bar[1 - p], aOff: pos.off[p], bOff: pos.off[1 - p], total: pos.total || 15 };
  }
  function flip(v) {
    const a = new Int8Array(26), b = new Int8Array(26);
    for (let n = 1; n <= 24; n++) { a[n] = v.b[25 - n]; b[n] = v.a[25 - n]; }
    return { a, b, aBar: v.bBar, bBar: v.aBar, aOff: v.bOff, bOff: v.aOff, total: v.total };
  }
  function pipsOf(v) {
    let pa = v.aBar * 25, pb = v.bBar * 25;
    for (let n = 1; n <= 24; n++) { pa += n * v.a[n]; pb += (25 - n) * v.b[n]; }
    return [pa, pb];
  }
  function contactOf(v) {
    let myMax = v.aBar > 0 ? 25 : 0;
    if (!myMax) for (let n = 24; n >= 1; n--) if (v.a[n] > 0) { myMax = n; break; }
    let oppMin = v.bBar > 0 ? 0 : 99;
    if (oppMin === 99) for (let n = 1; n <= 24; n++) if (v.b[n] > 0) { oppMin = n; break; }
    return myMax > oppMin;
  }

  // number of the 36 rolls in which the opponent can hit a blot on my n-point
  function shots(v, n) {
    const a = v.a, b = v.b;
    const pos = [];
    if (v.bBar > 0) pos.push(0);
    else for (let k = 1; k < n; k++) if (b[k] > 0) pos.push(k);
    if (!pos.length) return 0;
    let hits = 0;
    for (let d1 = 1; d1 <= 6; d1++) {
      for (let d2 = 1; d2 <= 6; d2++) {
        let hit = false;
        if (v.bBar >= 2) {
          hit = n <= 6 && (d1 === n || d2 === n);
        } else if (d1 === d2) {
          for (let q = 0; q < pos.length && !hit; q++) {
            const k = pos[q], dist = n - k;
            if (dist % d1 === 0 && dist / d1 <= 4) {
              let ok = true;
              for (let j = 1; j < dist / d1; j++) if (a[k + j * d1] >= 2) { ok = false; break; }
              if (ok) hit = true;
            }
          }
        } else {
          for (let q = 0; q < pos.length && !hit; q++) {
            const k = pos[q], dist = n - k;
            if (dist === d1 || dist === d2) hit = true;
            else if (dist === d1 + d2 && (a[k + d1] < 2 || a[k + d2] < 2)) hit = true;
          }
        }
        if (hit) hits++;
      }
    }
    return hits;
  }

  // value of holding a made point on my n-point
  const PV = [0, 2.2, 3.6, 5.2, 7.2, 8.6, 8.2, 6.4, 4.6, 3.0, 2.6, 2.2, 1.8, 1.4, 1.2, 1.2, 1.4, 2.4, 3.6, 4.6, 6.6, 6.0, 3.8, 2.2, 1.0];
  const PRIME = [0, 0, 1.5, 5, 11, 20, 32, 40];

  const BASE_W = { blot: 1.0, bar: 1.0, prime: 1.0, point: 1.0, hit: 1.0, pip: 1.0, safe: 1.0, stack: 1.0, builder: 1.0, anchor: 1.0 };
  const STYLES = {
    balanced: { name: 'Balanced', w: {} },
    aggressive: { name: 'Aggressive', w: { blot: 0.55, bar: 1.7, hit: 1.6, safe: 0.6, anchor: 0.7 } },
    defensive: { name: 'Defensive', w: { blot: 1.7, bar: 0.9, safe: 1.6, anchor: 1.5, prime: 0.8 } },
    primer: { name: 'Prime Builder', w: { prime: 2.2, point: 1.3, builder: 1.4, blot: 1.2 } },
    runner: { name: 'Runner', w: { pip: 1.5, prime: 0.6, point: 0.8, anchor: 0.6, blot: 1.1 } },
    gambler: { name: 'Gambler', w: { blot: 0.6, bar: 1.3, prime: 1.3, hit: 1.5, safe: 0.5, pip: 0.8 } },
  };
  const weightsFor = (style) => Object.assign({}, BASE_W, (STYLES[style] || STYLES.balanced).w);

  function sideScore(v, W, contact) {
    let s = 0;
    const a = v.a, b = v.b;
    if (!contact) {
      // racing: small penalties for wastage in the bear-in / bear-off
      let highest = 0;
      for (let n = 24; n >= 1; n--) if (a[n] > 0) { highest = n; break; }
      for (let n = 1; n < highest && n <= 6; n++) if (a[n] === 0) s -= 1.4;
      s -= 0.6 * (Math.max(0, a[1] - 2) + Math.max(0, a[2] - 3));
      for (let n = 1; n <= 24; n++) if (a[n] > 5) s -= (a[n] - 5) * 1.2;
      return s;
    }
    // opponent home board strength (their own home = my 19..24)
    let oppClosed = 0;
    for (let n = 19; n <= 24; n++) if (b[n] >= 2) oppClosed++;
    let myClosed = 0;
    for (let n = 1; n <= 6; n++) if (a[n] >= 2) myClosed++;

    // bar penalty
    if (v.aBar > 0) s -= v.aBar * (7 + 2.6 * oppClosed) * W.bar;

    let run = 0;
    for (let n = 1; n <= 25; n++) {
      const c = n <= 24 ? a[n] : 0;
      if (c >= 2) {
        // made point
        let pv = PV[n] * W.point;
        if (n >= 19) pv *= W.anchor;
        s += pv;
        run++;
        if (c > 5) s -= (c - 5) * 2.2 * W.stack;
        else if (c === 4) s -= 0.7 * W.stack;
      } else {
        if (run >= 2) {
          const start = n - run;
          // opponent checkers behind this prime
          let behind = v.bBar;
          for (let k = 1; k < start; k++) behind += b[k];
          const f = behind > 0 ? Math.min(1, 0.45 + behind * 0.28) : 0.12;
          s += PRIME[Math.min(run, 7)] * f * W.prime;
        }
        run = 0;
        if (c === 1) {
          // blot
          const sh = shots(v, n);
          if (sh > 0) {
            const loss = (25 - n) + 6 + 3.2 * oppClosed;
            s -= (sh / 36) * loss * W.blot;
          }
          if (n >= 19) s -= 0.4; // loose back checker
        }
      }
    }
    // builders for key unmade points
    for (let t = 3; t <= 8; t++) {
      if (a[t] >= 2) continue;
      let bu = 0;
      for (let n = t + 1; n <= t + 6 && n <= 24; n++) {
        if (a[n] === 1) bu++; else if (a[n] >= 3) bu += a[n] - 2;
      }
      s += PV[t] * 0.1 * Math.min(bu, 3) * W.builder * (a[t] === 1 ? 1.1 : 1);
    }
    // having borne checkers off while opponent is on the bar etc is already covered in pips
    return s;
  }

  function evalView(v, W) {
    const [pa, pb] = pipsOf(v);
    const contact = contactOf(v);
    let e = (pb - pa) * (contact ? 0.78 * W.pip : 1);
    e += sideScore(v, W, contact) - sideScore(flip(v), BASE_W, contact);
    if (contact && W.hit !== 1) e += (W.hit - 1) * v.bBar * 8;
    return e;
  }

  const evalPos = (pos, p, W) => evalView(view(pos, p), W || BASE_W);

  // ---- win probability estimates ----
  const erf = (x) => {
    const s = x < 0 ? -1 : 1; x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  };
  const Phi = (x) => 0.5 * (1 + erf(x / Math.SQRT2));
  const LOGI_SCALE = 30;

  // chance that `roller` wins, with roller about to roll
  function winProbRoller(pos, roller) {
    const v = view(pos, roller);
    const [pa, pb] = pipsOf(v);
    if (!contactOf(v)) {
      const wa = -sideScore(v, BASE_W, false), wb = -sideScore(flip(v), BASE_W, false);
      const A = pa + wa * 0.9, B = pb + wb * 0.9;
      const n = Math.max(1, (A + B) / 2 / 8.17);
      const sd = Math.sqrt(2 * n * 18.5);
      return Math.min(0.995, Math.max(0.005, Phi((B - A + 0.5) / sd)));
    }
    const e = evalView(v, BASE_W) + 5; // on roll
    return 1 / (1 + Math.exp(-e / LOGI_SCALE));
  }

  const LEVELS = {
    1: { name: 'Beginner', rand: 0.5, noise: 22, ply: 1, mult: 0.5, cube: 'never' },
    2: { name: 'Easy', rand: 0.22, noise: 12, ply: 1, mult: 0.75, cube: 'rare' },
    3: { name: 'Medium', rand: 0.06, noise: 8, ply: 1, mult: 1, cube: 'normal' },
    4: { name: 'Hard', rand: 0, noise: 4.5, ply: 1, mult: 1.45, cube: 'normal' },
    5: { name: 'Expert', rand: 0, noise: 0, ply: 1, mult: 2, cube: 'sharp' },
  };

  const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += Math.random(); return (u - 2) * 1.73; };

  const ROLLS = (() => { const r = []; for (let a = 1; a <= 6; a++) for (let b = a; b <= 6; b++) r.push({ a, b, w: a === b ? 1 : 2 }); return r; })();

  // Choose a full turn. Returns {moves, pos} or {moves: []} when no legal play.
  function chooseTurn(pos, p, dice, opts) {
    opts = opts || {};
    const lvl = LEVELS[opts.level || 3];
    const W = weightsFor(opts.style || 'balanced');
    const list = BG.genTurns(pos, p, dice);
    if (!list.length || !list[0].moves.length) return { moves: [], pos };
    if (list.length === 1) return list[0];
    if (!opts.exact && lvl.rand > 0 && Math.random() < lvl.rand) return list[Math.floor(Math.random() * list.length)];
    const noise = opts.exact ? 0 : lvl.noise;
    const scored = list.map(r => ({ r, s: evalPos(r.pos, p, W) + (noise ? gauss() * noise : 0) }));
    scored.sort((x, y) => y.s - x.s);
    const ply = lvl.ply;
    if (ply < 2 || scored.length < 2) return scored[0].r;
    // 2-ply over the best few candidates
    const K = Math.min(opts.k || 5, scored.length);
    let bestR = scored[0].r, bestV = -1e9;
    for (let c = 0; c < K; c++) {
      const cand = scored[c].r;
      if (BG.winnerOf(cand.pos) === p) return cand;
      let tot = 0;
      for (const roll of ROLLS) {
        const dl = BG.diceToList(roll.a, roll.b);
        const replies = BG.genTurns(cand.pos, 1 - p, dl);
        let bv = -1e9, bp = cand.pos;
        for (const rep of replies) {
          const vv = evalPos(rep.pos, 1 - p, BASE_W);
          if (vv > bv) { bv = vv; bp = rep.pos; }
        }
        tot += roll.w * (BG.winnerOf(bp) === 1 - p ? -500 : evalPos(bp, p, W));
      }
      const v = tot / 36;
      if (v > bestV) { bestV = v; bestR = cand; }
    }
    return bestR;
  }

  // ---- doubling cube ----
  function cubeParams(level, style) {
    const lvl = LEVELS[level || 3];
    let dbl = 0.69, tooGood = 0.9, take = 0.25;
    if (lvl.cube === 'rare') { dbl = 0.8; take = 0.3; }
    if (lvl.cube === 'sharp') { dbl = 0.68; take = 0.245; }
    if (style === 'gambler') { dbl -= 0.07; take -= 0.07; }
    if (style === 'defensive') { dbl += 0.05; take += 0.02; }
    if (style === 'aggressive') { dbl -= 0.03; take -= 0.02; }
    return { dbl, tooGood, take, never: lvl.cube === 'never' };
  }

  // AI is `p`, about to roll, deciding whether to double
  function shouldDouble(pos, p, opts) {
    const cp = cubeParams(opts.level, opts.style);
    if (cp.never) return false;
    const pw = winProbRoller(pos, p);
    const contact = BG.inContact(pos);
    if (pw < cp.dbl) return false;
    if (contact && pw > cp.tooGood) return false;
    return true;
  }

  // AI is `p`, opponent `1-p` has doubled and is about to roll
  function shouldTake(pos, p, opts) {
    const cp = cubeParams(opts.level, opts.style);
    if (cp.never) return Math.random() < 0.7;
    const myWin = 1 - winProbRoller(pos, 1 - p);
    return myWin >= cp.take;
  }

  return { view, evalPos, winProbRoller, chooseTurn, shouldDouble, shouldTake, LEVELS, STYLES, shots, pipsOf, contactOf, weightsFor };
})();

  // translucent glass dice: push the colour (saturation up, a touch deeper) and a little more body, so they do not wash out over the board
  const softGlass = (hex, satK, lift) => {

/* ---------- checker outlines ----------
   Every shape is stored as a polar table r(theta), normalised so its furthest point is 1, in canvas orientation
   (x right, y down, so "up" on screen is -y). Tables are built from unions of convex pieces (polygons and circles)
   or from a radial formula, then lightly smoothed to round the corners. The 2D sprites trace the outline directly;
   the 3D geometry scales its lathe rings by r(theta). Shapes must be star-shaped about the centre. */

  function rayPoly(pts, dx, dy) {                 // farthest hit of the ray from the origin with a convex polygon
    let best = 0;

      const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length], ex = x2 - x1, ey = y2 - y1, den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = (x1 * ey - y1 * ex) / den, u = (x1 * dy - y1 * dx) / den;
      if (t > 0 && u >= -1e-9 && u <= 1 + 1e-9 && t > best) best = t;
    }
    return best;
  }
  function rayCircle(cx, cy, r, dx, dy) {
    const b = dx * cx + dy * cy, c = cx * cx + cy * cy - r * r, disc = b * b - c;
    if (disc < 0) return 0;
    const s = b + Math.sqrt(disc);
    return s > 0 ? s : 0;
  }

/* ============================================================

const GEO = (() => {

  /* ---------- checker sprites ---------- */
  const SPR = { S: 176, cx: 88, cy: 80, R: 70, th: 9 };
  const spriteCache = {};

  function checkerSprite(setId, side) {
    const key = setId + side;
    if (spriteCache[key]) return spriteCache[key];
    const set = DATA.find('checkers', setId), st = set[side === 0 ? 'a' : 'b'];
    const c = mkCanvas(SPR.S, SPR.S), x = c.getContext('2d');

    if (st.pat === 'glass') return (spriteCache[key] = glassSprite(c, x, st, setId + side));

    let g = x.createLinearGradient(cx - R, 0, cx + R, 0);
    g.addColorStop(0, shade(st.base, 0.55)); g.addColorStop(0.5, shade(st.base, 0.78)); g.addColorStop(1, shade(st.base, 0.45));

  // see-through glass disc: the board shows through the body, the rim and wall are denser
  function glassSprite(c, x, st, seed) {
    const { cx, cy, R, th } = SPR, a = st.alpha === undefined ? 0.5 : st.alpha, rng = mulberry32(hashStr(seed)), fr = R - 9;

    x.fillStyle = g; x.beginPath(); x.arc(cx, cy + th, R, 0, 6.2832); x.fill();                                       // bottom edge showing through
    x.beginPath(); x.arc(cx, cy + th, R, 0, Math.PI); x.lineTo(cx - R, cy); x.lineTo(cx + R, cy); x.closePath(); x.fill();   // the wall
    g = x.createLinearGradient(cx - R, cy - R, cx + R, cy + R); g.addColorStop(0, rgba(st.hi, Math.min(1, a + 0.4))); g.addColorStop(0.5, rgba(st.rim, Math.min(1, a + 0.3))); g.addColorStop(1, rgba(st.lo, Math.min(1, a + 0.4)));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R, 0, 6.2832); x.fill();                                            // dense rim

    g.addColorStop(0, rgba(st.hi, a * 0.5)); g.addColorStop(0.55, rgba(st.base, a * 0.7)); g.addColorStop(1, rgba(st.rim, Math.min(1, a + 0.2)));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R - 6, 0, 6.2832); x.fill();
    x.save(); x.beginPath(); x.arc(cx, cy, fr, 0, 6.2832); x.clip(); GFX.ext.chk.glass(x, st, cx, cy, fr, rng, false); x.restore();
    x.strokeStyle = 'rgba(255,255,255,0.7)'; x.lineWidth = 1.6; x.beginPath(); x.arc(cx, cy, R - 1.5, Math.PI * 1.05, Math.PI * 1.7); x.stroke();      // bright edge on the light side
    x.strokeStyle = rgba(st.lo, 0.8); x.lineWidth = 1.4; x.beginPath(); x.arc(cx, cy, R - 0.7, 0, 6.2832); x.stroke();

    x.restore();

  }
  // the same sprite for a non-round outline: the wall is a stack of shifted copies, every ring follows the outline

    const { cx, cy, R, th } = SPR, rng = mulberry32(hashStr(seed)), P = (r, ox, oy) => SHAPES.path(x, shape, cx + (ox || 0), cy + (oy || 0), r);
    let g = x.createLinearGradient(cx - R, 0, cx + R, 0);
    g.addColorStop(0, shade(st.base, 0.55)); g.addColorStop(0.5, shade(st.base, 0.78)); g.addColorStop(1, shade(st.base, 0.45));
    for (let d = th; d >= 1; d--) { P(R, 0, d); x.fillStyle = d === th ? shade(st.base, 0.5) : g; x.fill(); }
    g = x.createLinearGradient(cx - R, cy - R, cx + R, cy + R); g.addColorStop(0, st.hi); g.addColorStop(0.5, st.rim); g.addColorStop(1, st.lo);

    g = x.createLinearGradient(cx + R, cy + R, cx - R, cy - R); g.addColorStop(0, st.hi); g.addColorStop(0.5, st.base); g.addColorStop(1, st.lo);

    g = x.createRadialGradient(cx - fr * 0.35, cy - fr * 0.4, fr * 0.1, cx, cy, fr * 1.05); g.addColorStop(0, st.hi); g.addColorStop(0.45, st.base); g.addColorStop(1, st.lo);
    x.fillStyle = g; P(fr); x.fill();
    x.save(); P(fr); x.clip(); drawCheckerPattern(x, st, cx, cy, fr * SHAPES.patScale(shape), rng, false, fr); x.restore();
    x.save(); P(fr); x.clip();
    g = x.createLinearGradient(cx - fr, cy - fr, cx + fr * 0.4, cy + fr * 0.6);
    const glossA = (st.pat === 'neon' || st.pat === 'obsidian' || st.pat === 'gem' || st.pat === 'onyx' || st.pat === 'crystal' || st.pat === 'pearl') ? 0.34 : st.pat === 'carbon' ? 0.22 : 0.16;
    g.addColorStop(0, `rgba(255,255,255,${glossA})`); g.addColorStop(0.5, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.ellipse(cx - fr * 0.25, cy - fr * 0.45, fr * 0.8, fr * 0.45, -0.5, 0, 6.2832); x.fill();

    x.save(); P(R - 6); x.clip(); x.strokeStyle = 'rgba(255,255,255,0.35)'; x.lineWidth = 1.2; x.beginPath(); x.arc(cx, cy, R - 6.5, Math.PI * 1.05, Math.PI * 1.75); x.stroke(); x.restore();

  function drawCheckerPattern(x, st, cx, cy, fr, rng, flat, full) {
    switch (st.pat) {
      case 'grooves': {
        x.strokeStyle = rgba(st.acc, 0.7); x.lineWidth = 2.5;
        x.beginPath(); x.arc(cx, cy, fr * 0.78, 0, 6.2832); x.stroke();
        x.strokeStyle = 'rgba(255,255,255,0.35)'; x.lineWidth = 1.5;
        x.beginPath(); x.arc(cx + 1, cy + 1.5, fr * 0.78, 0, 6.2832); x.stroke();
        x.strokeStyle = rgba(st.acc, 0.5); x.lineWidth = 2;
        x.beginPath(); x.arc(cx, cy, fr * 0.5, 0, 6.2832); x.stroke();
        x.strokeStyle = 'rgba(255,255,255,0.25)'; x.lineWidth = 1.2;
        x.beginPath(); x.arc(cx + 1, cy + 1.5, fr * 0.5, 0, 6.2832); x.stroke();
        const g = x.createRadialGradient(cx - 6, cy - 6, 2, cx, cy, fr * 0.45);
        g.addColorStop(0, 'rgba(255,255,255,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0.12)');

      }

        const ox = cx + (rng() - 0.5) * 60, oy = cy + (rng() - 0.5) * 60;
        for (let k = 1; k < 26; k++) {
          x.strokeStyle = rgba(st.acc, 0.10 + rng() * 0.22); x.lineWidth = 0.8 + rng() * 2.4;
          x.beginPath(); x.ellipse(ox, oy, k * 6.5 + rng() * 2, k * 5.6 + rng() * 2, rng() * 0.2, 0, 6.2832); x.stroke();
        }
        x.strokeStyle = rgba(st.acc, 0.5); x.lineWidth = 2;

          x.strokeStyle = rgba(st.acc, 0.25 + rng() * 0.35); x.lineWidth = lw; x.beginPath(); x.moveTo(px, py);

          x.beginPath(); x.arc(cx + (rng() - 0.5) * 70, cy + (rng() - 0.5) * 70, 18 + rng() * 40, rng() * 6, rng() * 6 + 1.6); x.stroke();

/* ============================================================
   BoardView: canvas board, checkers, dice, animations, particles, hit-testing
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = GFX.clamp;
const E = {
  inOut: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  out2: (u) => 1 - (1 - u) * (1 - u),
  out3: (u) => 1 - Math.pow(1 - u, 3),
  out4: (u) => 1 - Math.pow(1 - u, 4),
  in2: (u) => u * u,
  in3: (u) => u * u * u,
  back: (u) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const clamp01 = (u) => (u < 0 ? 0 : u > 1 ? 1 : u);
const rnd = (a, b) => a + Math.random() * (b - a);

// Bounce profile: optional initial fall from z0, then arcs of the given heights.
function bounceProfile(z0, heights) {
  const segs = [];
  if (z0 > 0) segs.push({ fall: true, h: z0, d: Math.sqrt(z0) });
  for (const h of heights) segs.push({ fall: false, h, d: 2 * Math.sqrt(h) });
  const tot = segs.reduce((a, s) => a + s.d, 0);
  let acc = 0;
  for (const s of segs) { s.a = acc / tot; acc += s.d; s.b = acc / tot; }
  const hits = segs.map(s => s.b);
  return {
    hits,
    z(u) {
      for (const s of segs) {
        if (u <= s.b) {
          const v = (u - s.a) / (s.b - s.a);
          return s.fall ? s.h * (1 - v * v) : s.h * 4 * v * (1 - v);
        }
      }
      return 0;
    },
  };
}

class BoardView {
  constructor(canvas, opts) {
    opts = opts || {};
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.cos = { board: 'club', checkers: 'classic', dice: 'ivory', moveFx: 'glide', throwFx: 'toss', trim: 'none', inlay: 'none', mat: 'none', cube: 'ivory' };
    this.pos = BG.startPos('classic');
    this.rot = false; this.cssW = 640; this.cssH = 400; this.dpr = 1; this.k = 0.5;
    this.numbers = true; this.fast = false; this.legalHints = true;
    this.sel = null; this.dests = []; this.movable = []; this.hint = null; this.hover = null;
    this.cube = { value: 1, owner: -1, show: false, glow: false };
    this.cubePos = null;
    this.dice = []; this.dblLeft = 0;
    this.parts = []; this.flights = []; this.tweens = []; this.drag = null; this.shake = 0; this.cup = null;
    this.boardImg = null; this.boardKey = ''; this.boardScale = 1;
    this.snd = () => { };
    this.running = false; this.lastT = 0; this.frameCount = 0;
    this._loop = (t) => { this.frame(t); if (this.running) this._raf = requestAnimationFrame(this._loop); };
    this.small = !!opts.small; this.zScale = 1;
  }

  /* ----- setup ----- */
  setCosmetics(c) { Object.assign(this.cos, c); this._sprites = {}; }
  setPos(p) { this.pos = BG.clone(p); this.pos.total = p.total || 15; }
  start() { if (this.running) return; this.running = true; this._raf = requestAnimationFrame(this._loop); }
  stop() { this.running = false; cancelAnimationFrame(this._raf); }
  setRotated(r) { if (this.rot !== r) { this.rot = r; } }

  fit(availW, availH) {
    const aspect = this.rot ? GEO.H / GEO.W : GEO.W / GEO.H;
    let w = availW, h = w / aspect;
    if (h > availH) { h = availH; w = h * aspect; }
    w = Math.max(120, Math.floor(w)); h = Math.max(80, Math.floor(h));
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cssW = w; this.cssH = h;
    this.cv.style.width = w + 'px'; this.cv.style.height = h + 'px';
    this.cv.width = Math.round(w * this.dpr); this.cv.height = Math.round(h * this.dpr);
    this.s = w / (this.rot ? GEO.H : GEO.W);   // css px per logical unit
    this.k = this.s * this.dpr;
    const Q = GFX.quality.get(), want = Math.min(Q.cap2d, Math.max(0.5, Math.ceil(this.k * 2 * Q.mult2d) / 2));
    if (want !== this.boardScale) { this.boardScale = want; this.boardKey = ''; }
  }

  boardImage() {
    const th = DATA.themeFor(this.cos);
    const key = (th.key || th.id) + '@' + this.boardScale;
    if (key !== this.boardKey) {
      const cv = GFX.mkCanvas(GEO.W * this.boardScale, GEO.H * this.boardScale);
      GFX.renderBoard(cv, th, this.boardScale);
      this.boardImg = cv; this.boardKey = key;
    }
    return this.boardImg;
  }

  /* ----- geometry ----- */
  toLogical(px, py) {
    if (this.rot) return { x: py / this.s, y: GEO.H - px / this.s };
    return { x: px / this.s, y: py / this.s };
  }
  step(n) { return n <= 5 ? 62 : Math.max(13, (GEO.L - 2 * GEO.r - 8) / (n - 1)); }
  slot(i, idx, n) {
    const off = GEO.r + 3 + idx * this.step(n);
    const x = GEO.ptX(i);
    return { x, y: GEO.ptIsTop(i) ? GEO.y0 + off : GEO.y1 - off };
  }
  barSlot(p, idx, n) {
    const st = Math.min(68, (GEO.y1 - GEO.r - GEO.mid - 52) / Math.max(1, n - 1));
    const off = 52 + idx * st;
    return { x: GEO.barX, y: p === 0 ? GEO.mid + off : GEO.mid - off };
  }
  offSlot(p, idx) {
    const x = GEO.trayX + GEO.trayW / 2;
    return { x, y: p === 0 ? GEO.y1 - 16 - idx * 15 : GEO.y0 + 16 + idx * 15 };
  }
  cubeTarget() {
    const x = GEO.trayX + GEO.trayW / 2;

  /* ----- tween engine ----- */

    }
  }

  celebrate() {

    }
  }

  /* ----- checkers ----- */
  sprite(p) {

  }
  drawChecker(ctx, x, y, p, o) {
    o = o || {};

  drawSlat(ctx, x, y, p) {

    ctx.restore();
  }

  /* ----- main draw ----- */
  frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - (this.lastT || now)) / 1000));
    this.lastT = now;
    this.frameCount++;
    // tweens
    for (let i = this.tweens.length - 1; i >= 0; i--) {
      const tw = this.tweens[i];
      if (tw.done) { this.tweens.splice(i, 1); continue; }

  draw(now) {

    this.drawHighlights(ctx, now);
    this.drawStacks(ctx, now);
    this.drawCube(ctx);
    this.drawFlights(ctx);
    this.drawDrag(ctx);
    this.drawDice(ctx);

    ctx.fillStyle = GFX.rgba(th.num, 0.8);

    }

  }

  drawHighlights(ctx, now) {
    const pulse = 0.5 + 0.5 * Math.sin(now / 260);
    const sh = this.pos && this.pos.shield;
    if (sh) for (const p of [0, 1]) {
      if (!sh[p]) continue;
      for (let i = 0; i < 24; i++) {
        if (BG.cnt(this.pos, p, i) !== 1) continue;
        const s = this.slot(i, 0, 1);

        ctx.strokeStyle = `rgba(${col},0.8)`; ctx.lineWidth = 3; ctx.stroke();
        continue;
      }

      ctx.beginPath(); ctx.moveTo(x - GEO.pw / 2 + 1, base); ctx.lineTo(x + GEO.pw / 2 - 1, base); ctx.lineTo(x, tip); ctx.closePath();

      ctx.strokeStyle = `rgba(${col},0.9)`; ctx.lineWidth = 2; ctx.stroke();

      if (this.hint.to === BG.OFF) b = { x: GEO.trayX + GEO.trayW / 2, y: p === 0 ? GEO.y1 - 160 : GEO.y0 + 160 };
      else { const own = BG.cnt(this.pos, p, this.hint.to); b = this.slot(this.hint.to, own, own + 1); }

      ctx.strokeStyle = `rgba(110,200,255,${0.7 + 0.3 * pulse})`; ctx.lineWidth = 5; ctx.setLineDash([12, 9]); ctx.lineDashOffset = -now / 40;
      ctx.shadowColor = '#6ec8ff'; ctx.shadowBlur = 12;

      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - 20 * Math.cos(ang - 0.45), b.y - 20 * Math.sin(ang - 0.45)); ctx.lineTo(b.x - 20 * Math.cos(ang + 0.45), b.y - 20 * Math.sin(ang + 0.45)); ctx.closePath(); ctx.fillStyle = '#6ec8ff'; ctx.fill();

  }

    const v = this.cube.owner === -1 ? 64 : this.cube.value;

  }

  }

  }

  drawDice(ctx) {
    const ds = DATA.find('dice', this.cos.dice);
    for (const d of this.dice) {
      if (!d.visible) continue;
      GFX.dieShadow(ctx, d.x, d.y, d.size * d.scale, d.z * 1.0);
    }
    for (const d of this.dice) {
      if (!d.visible) continue;
      const a = d.alpha * (d.used ? 0.38 : 1);
      GFX.drawDie3D(ctx, d.R, d.x - d.z * 0.1, d.y - d.z * 0.55, d.size * d.scale, ds, { alpha: a });
    }
    if (this.dblLeft > 0 && this.dice.length === 2 && this.dice[0].side === this.dice[1].side) {
      const c = this.dice[0];
      const mx = (this.dice[0].x + this.dice[1].x) / 2, my = Math.max(this.dice[0].y, this.dice[1].y) + 56;
      for (let i = 0; i < 4; i++) {

        ctx.fillStyle = i < this.dblLeft ? '#ffd75a' : 'rgba(0,0,0,0.35)'; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      }

  }

  drawCup(ctx, c) {
    ctx.save(); ctx.globalAlpha = c.alpha; ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(10, 70, 62, 20, 0, 0, TAU); ctx.fill();
    const g = ctx.createLinearGradient(-60, 0, 60, 0);
    g.addColorStop(0, '#3a2012'); g.addColorStop(0.3, '#8a5530'); g.addColorStop(0.6, '#6b3f22'); g.addColorStop(1, '#2e180c');
    ctx.fillStyle = g;

    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.stroke();

  drawParticles(ctx) {
    for (const p of this.parts) {

      ctx.save();

      }

    }
  }

  /* ----- checker move animation ----- */

  /* ----- drag ----- */
  beginDrag(p, from, x, y) { this.drag = { p, from, x, y }; }

  /* ----- dice ----- */
  clearDice() { this.dice = []; this.dblLeft = 0; this.cup = null; }

  setDieValue(idx, v) {
    const d = this.dice[idx]; if (!d) return;
    d.value = v; d.Rf = GFX.rotFinal(v, rnd(0, TAU)); d.R = d.Rf;
    this.ring(d.x, d.y, 'rgba(255,230,150,0.9)', 90, 0.5); this.snd('diceHit', 0.6);

      this.dblLeft = 0; const pool = rem.slice();

    }
  }
  diceEnd(spec, idx, nSame) {
    const cx = spec.side === 0 ? (GEO.xr + GEO.xEnd) / 2 : (GEO.x0 + GEO.xbar) / 2;
    const dx = nSame === 2 ? (idx === 0 ? -50 : 50) : nSame === 3 ? (idx - 1) * 66 : 0;
    return { x: cx + dx + rnd(-10, 10), y: GEO.mid + rnd(-26, 26) };
  }

  throwDice(specs, fxId) {
    const fx = fxId || this.cos.throwFx;

    const bySide = [specs.filter(s => s.side === 0).length, specs.filter(s => s.side === 1).length];
    const idxSide = [0, 0];
    const dice = specs.map((sp) => {
      const nSame = bySide[sp.side];
      const end = this.diceEnd(sp, idxSide[sp.side]++, nSame);
      const yaw = rnd(0, TAU);
      return { value: sp.value, side: sp.side, x: end.x, y: end.y, z: 0, size: 60, scale: 1, alpha: 0, visible: false, used: false, end, Rf: GFX.rotFinal(sp.value, yaw), R: GFX.rotFinal(sp.value, yaw), _hi: 0 };
    });

    const total = extra ? extra.T : T;

      for (let i = 0; i < dice.length; i++) {
        const pl = plans[i];
        pl.sample(clamp01(u * total / pl.T), u);
      }
      if (extra) extra.sample(u);

      for (const d of dice) { d.x = d.end.x; d.y = d.end.y; d.z = 0; d.scale = 1; d.alpha = 1; d.visible = true; d.R = d.Rf; }

/* ============================================================
   Studio: renders small 3D stills (shop thumbnails, icons) through the shared renderer.
   ============================================================ */
const Studio = (() => {
  let view = null;

  function getView() {
    if (!view) {
      const holder = document.createElement('div'), cv = document.createElement('canvas');
      holder.appendChild(cv);

    }

  }

    sc.eye = camera.eye; sc.vp = M4.mul(proj, view4); sc.light = lightFor(v);
    g.render(sc);

    return out;
  }
  function lightFor() { return makeLight(); }

  }

      v.fit(w, h); v.light = v.light || lightFor(v);
      const items = v.buildItems(0); v.pitch = 1.02;
      const sc = { eye: v.eye, vp: v.vp, light: lightFor(v), exposure: 1.18, amb: 1, spec: 1, items, ground: A3.board(id, 'lo').ground };
      const g = v.glr; g.resize(w, h, dpr); g.render(sc);
      const out = GFX.mkCanvas(w * dpr, h * dpr); out.getContext('2d').drawImage(g.canvas, 0, 0, out.width, out.height);
      return out;
    },
    checkers(setId, w, h, dpr) {
      const v = getView(); v.mi = 0; v.setCosmetics(Object.assign(cosOf(), { checkers: setId }));
      const items = [groundItem(v)];
      const put = (p, x, z, y0, lift) => items.push(v.checkerItem(p, x + 640, z + 400, y0, { lift: lift || 0 }));
      v.blob(items, 640 - 36, 400 + 4, 52, 0.5, 0); v.blob(items, 640 + 36, 400 - 4, 52, 0.5, 0);

      return shoot(w, h, dpr, { exposure: 1.18, amb: 1, spec: 1, items, ground: [0.06, 0.1, 0.07] }, { eye: [-20, 170, 215], target: [0, 8, 0], fov: 0.52 });
    },
    dice(id, w, h, dpr) {

    },

/* ---------- device integration: fullscreen, wake lock, haptics, compact layout ---------- */
const Device = (() => {
  let wake = null, lastBuzz = 0;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsOK = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  async function toggleFullscreen() {
    try {
      if (fsEl()) {
        const ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) await ex.call(document);
        try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) { }
      } else {
        const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!rq) throw new Error('unsupported');
        await rq.call(el, { navigationUI: 'hide' });
        if (P().settings.landscapeLock && screen.orientation && screen.orientation.lock) { try { await screen.orientation.lock('landscape'); } catch (e) { } }
      }
    } catch (e) { toast('Fullscreen was blocked here. In Chrome, open the menu and choose Add to Home screen, then launch it from there.'); }
    updateFs();
  }
  function updateFs() {
    const on = !!fsEl();
    $$('[data-fs]').forEach(b => { b.style.display = fsOK() ? '' : 'none'; const a = $('[data-fs-enter]', b), c = $('[data-fs-exit]', b); if (a) a.style.display = on ? 'none' : ''; if (c) c.style.display = on ? '' : 'none'; b.title = on ? 'Exit fullscreen' : 'Fullscreen'; });
  }
  async function keepAwake(on) {
    try {
      if (on && P().settings.wakeLock && navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
      else if (!on && wake) { await wake.release(); wake = null; }
    } catch (e) { wake = null; }
  }
  const PAT = { checker: 8, hit: [30, 30, 40], slam: 45, bearoff: 14, cube: 16, diceHit: 6, select: 5, win: [40, 50, 40, 50, 90], lose: 90, levelUp: [30, 40, 30, 40, 60], error: 20 };
  function haptic(name) {
    if (!P().settings.haptics || !navigator.vibrate || !PAT[name]) return;
    const now = performance.now(); if (now - lastBuzz < 45) return; lastBuzz = now;
    try { navigator.vibrate(PAT[name]); } catch (e) { }
  }
  function applyCompact() {
    const m = P().settings.compact, small = window.innerHeight < 540 && window.innerWidth > window.innerHeight;
    document.body.classList.toggle('compact', m === 'on' || (m === 'auto' && small));
    if (typeof Game !== 'undefined' && Game.fit) Game.fit();
  }
  document.addEventListener('fullscreenchange', updateFs); document.addEventListener('webkitfullscreenchange', updateFs);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Nav.cur === 'game') keepAwake(true); });
  window.addEventListener('resize', applyCompact);
  window.addEventListener('orientationchange', () => setTimeout(applyCompact, 200));
  return { toggleFullscreen, updateFs, keepAwake, haptic, applyCompact, fsOK, isFull: () => !!fsEl() };
})();

let menuView = null, attractRun = 0;
function startAttract() {
  const cv = $('#menu-board');
  if (!menuView) { menuView = makeView(cv, { small: true }); menuView.numbers = false; }
  const fitMenu = () => {
    const r = $('.menu-right'); if (!r || !r.clientWidth) return;
    const w = Math.min(r.clientWidth - 40, 780), h = Math.min(r.clientHeight - 40, 700);
    menuView.fit(Math.max(260, w), Math.max(200, h));
  };
  fitMenu();
  const e = P().equipped;
  menuView.setCosmetics({ board: e.board, checkers: e.checkers, dice: e.dice, moveFx: e.moveFx, throwFx: e.throwFx, trim: e.trim, inlay: e.inlay, mat: e.mat, cube: e.cube });
  menuView.start();
  const id = ++attractRun;
  menuView.fast = false;
  (async () => {
    const v = menuView;
    let pos = BG.startPos('classic'), p = Math.random() < 0.5 ? 0 : 1;
    v.setPos(pos); v.clearDice(); v.tweens.length = 0; v.flights.length = 0;
    await v.wait(900);
    while (id === attractRun) {
      const d1 = BG.rollDie(), d2 = BG.rollDie();
      await v.throwDice([{ value: d1, side: p }, { value: d2, side: p }]);
      if (id !== attractRun) return;
      const r = AI.chooseTurn(pos, p, BG.diceToList(d1, d2), { level: 3 });
      v.turnPlayer = p;
      await v.wait(350);
      for (const m of r.moves) {
        pos = BG.applyMove(pos, p, m);
        await v.moveChecker(m, p);
        if (id !== attractRun) return;
        await v.wait(110);
      }
      await v.wait(900);
      if (BG.winnerOf(pos) >= 0 || BG.pips(pos, 0) < 40 || BG.pips(pos, 1) < 40) { pos = BG.startPos('classic'); v.setPos(pos); v.clearDice(); p = 0; await v.wait(700); continue; }
      p = 1 - p;
    }
  })();
  window.addEventListener('resize', fitMenu);
  menuView._fit = fitMenu;
}
function stopAttract() { attractRun++; if (menuView) { menuView.stop(); window.removeEventListener('resize', menuView._fit); } }
